# SAP connection — override with application-prod.properties on the server
sap.ashost=localhost
sap.sysnr=00
sap.client=000
sap.user=changeme
sap.passwd=changeme
sap.lang=EN

sap.rfc.readTable=RFC_READ_TABLE

##### SAP OData — override with application-prod.properties on the server, same as above.
##### Base URL for standard SAP OData V2/V4 services (NetWeaver Gateway), e.g.
##### https://<host>:<port>/sap/opu/odata/sap  (V2)  or  /sap/opu/odata4/sap  (V4).
##### Per-tenant base URLs are a follow-on once the multi-tenant SAP connection registry lands.
sap.odata.base-url=https://localhost/sap/opu/odata/sap
sap.odata.user=changeme
sap.odata.password=changeme

##### Fake-SAP test double (MockSapODataController) - OFF by default, never enable in prod.
##### To test SapODataClient end-to-end without a real SAP connection, set:
#####   sap.odata.mock.enabled=true
#####   sap.odata.base-url=http://localhost:8081/mock-sap
#####   sap.mode.VENDOR_CREATE=ODATA
##### then exercise the normal Vendor Registration "post to SAP" flow - it will hit the mock
##### controller over real HTTP, go through the real CSRF handshake, and get back a canned but
##### realistically-shaped OData response. Flip sap.mode.* back to FM (or this to false) to
##### return to the real JCo path.
sap.odata.mock.enabled=false

##### Per-operation transport switch: ODATA (default - unset falls here) or FM (via JCo).
##### See SapOperationCode for the full list of operation codes this app knows about. Default is
##### ODATA everywhere, but SapIntegrationModeConfig.effectiveMode() automatically falls back to
##### FM (with a log warning) for any operation whose sap.odata.service.<CODE> below is still
##### empty - so this being "ODATA by default" never breaks an operation that isn't configured
##### yet. Only VENDOR_CREATE/VENDOR_VALIDATE actually have a wired odataXxx() implementation
##### today (VendorSapPostingServiceImpl) - the other operation codes below are the prepared
##### config surface for the same genericXxx/fmXxx/odataXxx pattern once each is extracted from
##### its current controller/service (PRController, ReservationService, SESService,
##### MasterDataService, SapPrFetchServiceImpl); until that extraction happens, setting their
##### sap.mode.*/sap.odata.service.* here has no effect - they still call their JCo function
##### directly and unconditionally.
##### VENDOR_CREATE/VALIDATE are pinned to FM for real (not just commented out, unlike the rest
##### of this file) - these are the only two operations with an actual wired odataXxx()
##### implementation today, and its field mapping is still UNVERIFIED against any real system
##### (see VendorSapPostingServiceImpl's own comment). Defaulting to ODATA here would silently
##### break the one vendor-registration flow that currently works for real, against a placeholder
##### base-url. Flip to ODATA only after confirming the API_SUPPLIER mapping against a real/
##### sandbox system (or the mock - see sap.odata.mock.enabled below).
sap.mode.VENDOR_CREATE=FM
sap.mode.VENDOR_VALIDATE=FM

##### OData service/entity-set name per operation. Filled in only where independently verifiable
##### (API_SUPPLIER is SAP's standard, documented Supplier-create service). Every other value
##### below is deliberately left empty - DO NOT fill these with a guessed name. Confirm the real
##### value from the SAP Business Accelerator Hub (for the operations whose FM is a thin wrapper
##### around a standard BAPI - see docs/sap-integration-audit.md) or the client's own Gateway
##### service catalog (for the genuinely custom Z-functions - only the client can say whether a
##### matching custom OData service was ever built for those).
sap.odata.service.VENDOR_CREATE=API_SUPPLIER
sap.odata.service.VENDOR_VALIDATE=API_SUPPLIER
sap.odata.service.PR_CREATE=
sap.odata.service.PR_CHANGE=
sap.odata.service.PR_GETDETAIL=
sap.odata.service.PR_SEARCH=
sap.odata.service.PR_USER_DATA=
sap.odata.service.PR_REL_DTLS=
sap.odata.service.PR_ACTIVE_WBS=
sap.odata.service.PR_PROJ_WBS=
sap.odata.service.PR_AGREEMENT_LIST=
sap.odata.service.PR_GL_ACCOUNT=
sap.odata.service.RESERVATION_CREATE=
sap.odata.service.RESERVATION_CHANGE=
sap.odata.service.RESERVATION_GETDETAIL=
sap.odata.service.RESERVATION_ACTIVE_WBS=
sap.odata.service.SES_LIST=
sap.odata.service.SES_GETDETAIL=
sap.odata.service.SES_RELEASE=
sap.odata.service.MATERIAL_SEARCH=
sap.odata.service.MATERIAL_GETDETAIL=
sap.odata.service.SERVICE_MASTER_LIST=
