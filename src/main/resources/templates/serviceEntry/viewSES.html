<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="layout">

<head>
    <meta charset="UTF-8">
    <title th:text="'Service Entry Sheet - ' + ${ses.sesNumber}">SES</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

    <style>
        /* ===== BASE STYLES ===== */
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            margin: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* Page Header */
        header {
            background: #ff5f00;
            color: white;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
        }

        /* ===== ENTRY SHEET HEADER CARD ===== */
        .header-card {
            background: #fff;
            border-radius: 8px;
            padding: 10px 20px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
            margin-bottom: 12px;
            margin-top: 8px;
        }

        .header-card h3 {
            color: #033882;
            font-size: 18px;
            margin: 0 0 8px 0;
            padding-bottom: 4px;
            border-bottom: 2px solid #033882;
        }

        .header-grid {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: nowrap;
        }

        .header-grid > div {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .header-grid label {
            font-weight: 600;
            font-size: 12px;
            color: #033882;
            margin-bottom: 3px;
        }

        .header-grid .field-value {
            font-size: 13px;
            color: #222;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== TWO CARDS LAYOUT (Basic Data & Accepted Data) ===== */
        .ses-info-row {
            display: flex;
            justify-content: space-between;
            gap: 3%;
            align-items: stretch;
            margin: 12px 0 20px;
        }

        .ses-card {
            flex: 1 1 48%;
            display: flex;
            flex-direction: column;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            border: 1px solid rgba(3,56,130,0.1);
        }

        /* Orange header with white text */
        .ses-card > h3 {
            background: #ff5f00;
            color: #fff;
            margin: 0;
            padding: 10px 16px;
            font-size: 15px;
            font-weight: 600;
        }

        /* Content area - grows to make both cards equal height */
        .ses-content {
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        /* Field row inside card */
        .ses-field {
            display: flex;
            justify-content: space-between;
            gap: 3px;
            align-items: center;
            padding: 1px 0;
        }

        /* Label styling */
        .ses-label {
            color: #033882;
            font-weight: 700;
            font-size: 13px;
            min-width: 40%;
        }

        /* Value styling */
        .ses-value {
            color: #222;
            text-align: right;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        /* Bottom spacer for shorter card to match taller card visually */
        .card-bottom-spacer {
            height: 5px;
            margin-top: auto;
        }

        /* ===== TABLE STYLES (copied from createServicePR) ===== */
        .card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .card h3 {
            color: #033882;
            font-weight: 700;
            margin: 0 0 15px 0;
        }

        /* Table wrapper with scroll */
        .item-table-wrapper {
            max-height: 420px;
            overflow: auto;
            border-radius: 8px;
            border: 1px solid #dee2e6;
            background: #fff;
            box-shadow: 0 1px 6px rgba(0,0,0,0.05);
        }

        /* Table base styles */
        #itemTable {
            width: 100% !important;
            table-layout: fixed !important;
            border-collapse: separate !important;
            border-spacing: 0 !important;
        }

        /* Sticky header with blue background */
        #itemTable thead th {
            position: sticky;
            top: 0;
            background: #033882 !important;
            color: #fff !important;
            z-index: 5;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            padding: 12px 8px;
            border-bottom: 2px solid #022b65;
            vertical-align: middle;
            box-sizing: border-box;
        }

        /* Table body cells */
        #itemTable td {
            font-size: 14px;
            vertical-align: middle;
            white-space: nowrap;
            text-align: center;
            background: #fff;
            padding: 10px 8px;
            border-bottom: 1px solid #f0f0f0;
            box-sizing: border-box;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Specific column widths - FIXED to maintain alignment at all zoom levels */
        #itemTable th:nth-child(1), #itemTable td:nth-child(1) {
            width: 8% !important;
            max-width: 8% !important;
            min-width: 60px !important;
        } /* Line # */

        #itemTable th:nth-child(2), #itemTable td:nth-child(2) {
            width: 12% !important;
            max-width: 12% !important;
            min-width: 100px !important;
        } /* Service No */

        #itemTable th:nth-child(3), #itemTable td:nth-child(3) {
            width: 25% !important;
            max-width: 25% !important;
            min-width: 150px !important;
            text-align: left !important;
            padding-left: 12px !important;
        } /* Description */

        #itemTable th:nth-child(4), #itemTable td:nth-child(4) {
            width: 10% !important;
            max-width: 10% !important;
            min-width: 70px !important;
            text-align: right !important;
            padding-right: 12px !important;
        } /* Qty */

        #itemTable th:nth-child(5), #itemTable td:nth-child(5) {
            width: 8% !important;
            max-width: 8% !important;
            min-width: 60px !important;
        } /* Unit */

        #itemTable th:nth-child(6), #itemTable td:nth-child(6) {
            width: 12% !important;
            max-width: 12% !important;
            min-width: 90px !important;
            text-align: right !important;
            padding-right: 12px !important;
        } /* Gross Price */

        #itemTable th:nth-child(7), #itemTable td:nth-child(7) {
            width: 12% !important;
            max-width: 12% !important;
            min-width: 90px !important;
        } /* Cost Center */

        #itemTable th:nth-child(8), #itemTable td:nth-child(8) {
            width: 8% !important;
            max-width: 8% !important;
            min-width: 70px !important;
        } /* Order */

        #itemTable th:nth-child(9), #itemTable td:nth-child(9) {
            width: 10% !important;
            max-width: 10% !important;
            min-width: 70px !important;
        } /* Tax Code */

        /* First column styling */
        #itemTable th:first-child {
            position: sticky;
            left: 0;
            z-index: 6;
            background: #033882 !important;
            font-weight: 600;
        }

        #itemTable td:first-child {
            position: sticky;
            left: 0;
            z-index: 3;
            background: #fff;
            font-weight: 600;
        }

        /* Scrollbar styling */
        .item-table-wrapper::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }

        .item-table-wrapper::-webkit-scrollbar-thumb {
            background-color: #033882;
            border-radius: 4px;
        }

        .item-table-wrapper::-webkit-scrollbar-track {
            background-color: #f1f1f1;
        }

        /* DataTables override - Force consistent styling */
        table.dataTable {
            border-collapse: separate !important;
            border-spacing: 0 !important;
            table-layout: fixed !important;
            width: 100% !important;
        }

        table.dataTable thead {
            background: #033882 !important;
            color: white !important;
        }

        table.dataTable thead th {
            background: #033882 !important;
            color: white !important;
            border-bottom: 2px solid #022b65 !important;
            box-sizing: border-box !important;
        }

        table.dataTable tbody tr:hover {
            background-color: #f8f9fa !important;
        }

        table.dataTable tbody tr:hover td:first-child {
            background-color: #f0f0f0 !important;
        }

        /* Ensure proper alignment for all cells */
        table.dataTable tbody td {
            vertical-align: middle !important;
            box-sizing: border-box !important;
        }

        /* Remove DataTables default padding that causes misalignment */
        table.dataTable thead .sorting,
        table.dataTable thead .sorting_asc,
        table.dataTable thead .sorting_desc,
        table.dataTable thead .sorting_asc_disabled,
        table.dataTable thead .sorting_desc_disabled {
            padding-right: 30px !important;
            background-position: center right 8px !important;
            cursor: pointer;
        }

        /* Override DataTables wrapper to prevent width issues */
        .dataTables_wrapper {
            width: 100% !important;
        }

        .dataTables_wrapper .dataTables_scroll {
            width: 100% !important;
        }

        .dataTables_wrapper .dataTables_scrollHead {
            overflow: hidden !important;
        }

        .dataTables_wrapper .dataTables_scrollBody {
            overflow: auto !important;
        }

        /* Fix DataTables info and pagination alignment */
        .dataTables_info, .dataTables_paginate {
            margin-top: 12px !important;
            font-size: 14px !important;
        }

        /* Ensure table header and body have same width */
        .dataTables_scrollHeadInner,
        .dataTables_scrollHeadInner table {
            width: 100% !important;
        }

        /* Prevent column resizing on zoom */
        .dataTables_scrollBody table {
            table-layout: fixed !important;
        }

        /* ===== BUTTONS ===== */
        .btn-back {
            background: #033882;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .btn-back:hover {
            background: #ff5f00;
        }
        .button-group {
            display: flex;
            gap: 18px;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 900px) {
            .ses-info-row {
                flex-direction: column;
                gap: 12px;
            }

            .ses-card {
                flex-basis: auto;
            }
        }

        @media (max-width: 520px) {
            .ses-field {
                flex-direction: column;
                align-items: flex-start;
            }

            .ses-value {
                text-align: left;
                white-space: normal;
            }

            .header-grid {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div layout:fragment="content" class="container-fluid mt-4">
        <header>Service Entry Sheet - <span th:text="${ses.sesNumber}"></span> (<span th:text="${ses.shortText}"></span>)</header>
        <input type="hidden" name="sesNumber" id="sesNumber"  th:value="${ses.sesNumber}">
        <!-- Entry Sheet Header -->
        <div class="header-card">
            <h3>Entry Sheet Basic Data</h3>
            <div class="header-grid">
                <div>
                    <label>Purchase Order:</label>
                    <span class="field-value" th:text="${ses.poNumber}"></span>
                </div>
                <div>
                    <label>Item Number</label>
                    <span class="field-value" th:text="${ses.poItemNO}"></span>
                </div>
                <div>
                    <label>Created By</label>
                    <span class="field-value" th:text="${ses.vendorName}"></span>
                </div>
                <div>
                    <label>Total Amount:</label>
                    <span class="field-value" th:text="${#numbers.formatDecimal(ses.totalAmount,2,2)}"></span>
                </div>
            </div>
        </div>

        <!-- Basic Data & Accepted Data Cards -->
        <div class="ses-info-row">
            <div class="ses-card ses-card-basic">
                <h3>Basic Data</h3>
                <div class="ses-content">
                    <div class="ses-field">
                        <label class="ses-label">Account Assignment</label>
                        <span class="ses-value field-value" th:text="${ses.accAsst}"></span>
                    </div>
                    <div class="ses-field">
                        <label class="ses-label">External Number</label>
                        <span class="ses-value field-value" th:text="${ses.extNumber}"></span>
                    </div>
                    <div class="ses-field">
                        <label class="ses-label">PRsp. External</label>
                        <span class="ses-value field-value" th:text="${ses.perExt}"></span>
                    </div>
                    <div class="ses-field">
                        <label class="ses-label">Short Text</label>
                        <span class="ses-value field-value" th:text="${ses.shortText}"></span>
                    </div>
                    <div class="card-bottom-spacer"></div>
                </div>
            </div>

            <div class="ses-card ses-card-accepted">
                <h3>Accepted Data</h3>
                <div class="ses-content">
                    <div class="ses-field">
                        <label class="ses-label">Doc. Date</label>
                        <span class="ses-value field-value" th:text="${#temporals.format(ses.entryDate, 'dd.MM.yyyy')}"></span>
                    </div>
                    <div class="ses-field">
                        <label class="ses-label">Posting Date</label>
                        <span class="ses-value field-value" th:text="${#temporals.format(ses.postingDate, 'dd.MM.yyyy')}"></span>
                    </div>
                    <div class="ses-field">
                        <label class="ses-label">Reference</label>
                        <span class="ses-value field-value" th:text="${ses.referenceDoc}"></span>
                    </div>
                    <div class="ses-field">
                        <label class="ses-label">Doc Text</label>
                        <span class="ses-value field-value" th:text="${ses.docText}"></span>
                    </div>
                    <div class="card-bottom-spacer"></div>
                </div>
            </div>
        </div>

        <!-- Service Line Items Table -->
        <div class="card">
            <h3>Service Line Items</h3>
            <div class="item-table-wrapper">
                <table id="itemTable" class="display">
                    <thead>
                    <tr>
                        <th>Line #</th>
                        <th>Service No</th>
                        <th>Description</th>
                        <th>Qty</th>
                        <th>Unit</th>
                        <th>Gross Price</th>
                        <th>Cost Center</th>
                        <th>Order</th>
                        <th>Tax Code</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${ses.lineItems}">
                        <td th:text="${item.lineNumber}"></td>
                        <td th:text="${item.serviceNumber}"></td>
                        <td th:text="${item.shortText}"></td>
                        <td th:text="${item.quantity}"></td>
                        <td th:text="${item.unit}"></td>
                        <td th:text="${#numbers.formatDecimal(item.grossPrice,2,2)}"></td>
                        <td th:text="${item.costCenter}"></td>
                        <td th:text="${item.order}"></td>
                        <td th:text="${item.taxCode}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="button-group">
            <button onclick="window.history.back()" class="btn-back">← Back</button>
            <button th:if="${ses.status == 'UNRELEASED'}" onclick="releaseSES()" class="btn-back"><span><i class="fa fa-check-circle"></i></span> Approve</button>
        </div>

    </div>
</div>
<div layout:fragment="scriptContent">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">
        $(document).ready(function() {
            var table = $('#itemTable').DataTable({
                scrollY: '350px',
                scrollX: true,
                scrollCollapse: true,
                paging: true,
                searching: true,
                ordering: true,
                autoWidth: false,
                fixedColumns: false,
                columnDefs: [
                    { targets: 0, width: "8%", className: "dt-center" },
                    { targets: 1, width: "12%", className: "dt-center" },
                    { targets: 2, width: "25%", className: "dt-left" },
                    { targets: 3, width: "10%", className: "dt-right" },
                    { targets: 4, width: "8%", className: "dt-center" },
                    { targets: 5, width: "12%", className: "dt-right" },
                    { targets: 6, width: "12%", className: "dt-center" },
                    { targets: 7, width: "8%", className: "dt-center" },
                    { targets: 8, width: "10%", className: "dt-center" }
                ],
                drawCallback: function() {
                    // Force table layout to remain fixed after draw
                    $('#itemTable').css('table-layout', 'fixed');
                }
            });

            // Force fixed layout on window resize/zoom
            $(window).on('resize', function() {
                setTimeout(function() {
                    table.columns.adjust();
                    $('#itemTable').css('table-layout', 'fixed');
                }, 100);
            });
        });
       function releaseSES() {
    let sesNumber=document.getElementById("sesNumber").value;

    Swal.fire({
        title: "Are you sure?",
        text: "Do you want to approve SES " + sesNumber + "?",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Yes, Approve",
        cancelButtonText: "Cancel"
    }).then((result) => {
        if (!result.isConfirmed) return;

        const csrfHeader = document.querySelector('meta[name="_csrf_header"]');
        const csrfToken = document.querySelector('meta[name="_csrf"]');

        const headers = {
            'Content-Type': 'application/json'
        };

        if (csrfHeader && csrfToken) {
            headers[csrfHeader.content] = csrfToken.content;
        }

        fetch('/ses/releaseEntrySheet', {
            method: 'POST',
            headers: headers,
            body: JSON.stringify({ sesNumber: sesNumber })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                Swal.fire("Approved!", data.message, "success")

                    .then(() => window.location.href = "/ses/list");

            } else {
                Swal.fire("Error", data.message, "error");
            }
        })
        .catch(err => {
            console.error("Error:", err);
            Swal.fire("Error", "Unexpected error occurred.", "error");
        });
    });
}

    </script>

</div>
</body>
</html>
