<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="layout">

<head>
    <meta charset="UTF-8">
    <title>SES List</title>

    <!-- Bootstrap + DataTables -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">

    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .btn-sync {
            background-color: #033882;
            color: #fff;
        }
        .btn-sync:hover {
            background-color: #0256c0;
            color: #fff;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .toggle-filter {
            display: flex;
            border: 2px solid #033882;
            border-radius: 5px;
            overflow: hidden;
        }
        .toggle-filter .btn {
            border: none;
            border-radius: 0;
            padding: 8px 20px;
            background-color: #fff;
            color: #033882;
            font-weight: 500;
            transition: all 0.3s;
        }
        .toggle-filter .btn.active {
            background-color: #033882;
            color: #fff;
        }
        .toggle-filter .btn:hover:not(.active) {
            background-color: #f0f0f0;
        }
    </style>
</head>

<body>
<div layout:fragment="content" class="container-fluid mt-4">



    <div class="page-header">
        <h4><i class="bi bi-file-earmark-text"></i> Service Entry Sheet List</h4>
        <div class="header-actions">
            <div class="toggle-filter">
                <button class="btn active" id="toActBtn" onclick="filterToAct()">
                    <i class="bi bi-exclamation-circle"></i> To Act
                </button>
                <button class="btn" id="allBtn" onclick="filterAll()">
                    <i class="bi bi-list-ul"></i> All
                </button>
            </div>
            <button id="syncBtn" class="btn btn-sync" onclick="window.location.href='/ses/sync'">
                <i class="bi bi-arrow-repeat"></i>  Sync from SAP
            </button>
        </div>
    </div>

    <table id="sesTable" class="table table-striped table-bordered table-hover" style="width:100%">
        <thead class="table-primary">
        <tr>
            <th>SES Number</th>
            <th>PO Number</th>
            <th>Vendor</th>
            <th>Short Text</th>
            <th>Status</th>
            <th>Entry Date</th>
            <th>Posting Date</th>
            <th>Total Amount</th>
            <th>Currency</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="ses : ${sesList}" th:attr="data-status=${ses.status}">
            <td>
                <a th:if="${ses.status != 'Released'}"
                   th:href="@{/ses/read/{sesNumber}(sesNumber=${ses.sesNumber})}"
                   th:text="${ses.sesNumber}"></a>
                <span th:if="${ses.status == 'Released'}" th:text="${ses.sesNumber}"></span>
            </td>

            <td th:text="${ses.poNumber}"></td>
            <td th:text="${ses.vendorName}"></td>
            <td th:text="${ses.shortText}"></td>
            <td>
                <!-- Use a single SpEL expression for the ternary to avoid parsing errors -->
                <span th:classappend="${ses.status == 'Released' ? 'badge bg-success' : 'badge bg-warning text-dark'}"
                      th:text="${ses.status}"></span>
            </td>

            <!-- Handle both java.time (LocalDate) and java.util.Date/java.sql.Date using instanceof -->
            <td th:text="${ses.entryDate != null ? (ses.entryDate instanceof T(java.time.LocalDate) ? #temporals.format(ses.entryDate, 'dd-MMM-yyyy') : #dates.format(ses.entryDate, 'dd-MMM-yyyy')) : ''}"></td>
            <td th:text="${ses.postingDate != null ? (ses.postingDate instanceof T(java.time.LocalDate) ? #temporals.format(ses.postingDate, 'dd-MMM-yyyy') : #dates.format(ses.postingDate, 'dd-MMM-yyyy')) : ''}"></td>
            <td th:text="${ses.totalAmount != null ? #numbers.formatDecimal(ses.totalAmount, 2, 2) : ''}"></td>

            <td th:text="${ses.currency}"></td>
        </tr>
        </tbody>
    </table>

</div>

<div layout:fragment="scriptContent">
    <!-- JS: Bootstrap + DataTables + SweetAlert -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="text/javascript">
        // Define functions in global scope
        var dataTable;

        function filterToAct() {
            console.log('filterToAct called');
            // Activate "To Act" button
            $('#toActBtn').addClass('active');
            $('#allBtn').removeClass('active');

            // Clear all existing custom filters first
            $.fn.dataTable.ext.search = [];

            // Add filter to show ONLY UNRELEASED items (exact match, capital letters)
            $.fn.dataTable.ext.search.push(
                function(settings, data, dataIndex) {
                    var row = $('#sesTable').DataTable().row(dataIndex).node();
                    var status = $(row).attr('data-status');
                    // Show ONLY items with status exactly equal to 'UNRELEASED'
                    return status === 'UNRELEASED';
                }
            );

            if (dataTable) {
                dataTable.draw();
            }
        }

        function filterAll() {
            console.log('filterAll called');
            // Activate "All" button
            $('#allBtn').addClass('active');
            $('#toActBtn').removeClass('active');

            // Clear all custom filters to show all items
            $.fn.dataTable.ext.search = [];

            if (dataTable) {
                dataTable.draw();
            }
        }

        $(document).ready(function () {
            console.log('Document ready - initializing DataTable');

            // Avoid double bracket syntax to prevent Thymeleaf conflict
            var orderConfig = [];
            orderConfig.push([0, 'desc']);

            // Initialize DataTable
            dataTable = $('#sesTable').DataTable({
                "pageLength": 10,
                "order": orderConfig,
                "language": {
                    search: "Filter:"
                }
            });

            // Apply "To Act" filter by default on page load
            filterToAct();
        });
    </script>
</div>
</body>
</html>
