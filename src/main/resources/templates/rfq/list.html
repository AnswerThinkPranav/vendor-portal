<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="layout">
<head>
    <meta charset="UTF-8">
    <title>List of RFQs</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <style>
        .vr-breadcrumb { font-size: 13px; color: #6c7a91; margin-bottom: 18px; letter-spacing: .2px; }
        .vr-breadcrumb .current { color: var(--blue-color); font-weight: 600; }

        .vr-card { background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(3, 56, 130, 0.08); overflow: hidden; width: 100%; margin: 0 0 24px 0; }
        .vr-card-header { background: linear-gradient(120deg, var(--blue-color) 0%, #3b4a5e 100%); color: #fff; padding: 18px 28px; }
        .vr-card-header h4 { margin: 0; font-weight: 700; letter-spacing: .3px; }
        .vr-card-header p { margin: 2px 0 0 0; opacity: .85; font-size: 13px; }

        .vr-filter-bar {
            display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px;
            padding: 18px 28px; border-bottom: 1px solid #eef1f6; background: #fbfcfe;
        }
        .vr-filter-field { display: flex; flex-direction: column; gap: 4px; }
        .vr-filter-field label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: #7c879b; }
        .vr-filter-field .form-control { border-radius: 9px; border: 1px solid #dde3ec; height: 36px; font-size: 13.5px; box-shadow: none; }
        .vr-filter-field .form-control:focus { border-color: var(--blue-color); box-shadow: 0 0 0 3px rgba(3, 56, 130, 0.12); }
        .vr-go-btn {
            background: linear-gradient(120deg, var(--blue-color), #3b4a5e); border: none; border-radius: 9px;
            padding: 8px 20px; font-weight: 600; color: #fff; height: 36px; font-size: 13.5px;
        }
        .vr-go-btn:hover { color: #fff; transform: translateY(-1px); }

        .vr-table-wrap { padding: 6px 28px 10px 28px; overflow-x: auto; }
        table.vr-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        table.vr-table thead th {
            background: #2d3f55; color: #fff; font-weight: 700;
            font-size: 11.5px; letter-spacing: .3px; padding: 10px 12px; text-align: center; border-bottom: 2px solid #1f2937;
        }
        table.vr-table tbody td { padding: 9px 12px; text-align: center; }
        table.vr-table tbody tr td:first-child a { font-weight: 700; color: #1c2733; }
        .vr-legend { display: flex; flex-wrap: wrap; gap: 18px; padding: 4px 28px 22px 28px; font-size: 12.5px; color: #4b5876; }
        .vr-legend span { display: inline-flex; align-items: center; gap: 6px; }
        .vr-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <div class="vr-breadcrumb">RFQs &nbsp;/&nbsp; <span class="current">List of RFQs</span></div>

        <div class="vr-card">
            <div class="vr-card-header">
                <h4>List of RFQs</h4>
                <p>Requests for Quotation raised against your Purchase Requisitions</p>
            </div>

            <form class="vr-filter-bar" id="filterForm" onsubmit="return false;">
                <div class="vr-filter-field">
                    <label>From Date</label>
                    <input type="date" class="form-control" id="f_fromDate" th:value="${fromDate}">
                </div>
                <div class="vr-filter-field">
                    <label>To Date</label>
                    <input type="date" class="form-control" id="f_toDate" th:value="${toDate}">
                </div>
                <div class="vr-filter-field" th:unless="${isVendor}">
                    <label>Type</label>
                    <select class="form-control" id="f_rfqType">
                        <option value="DOM" th:selected="${rfqType == 'DOM'}">Domestic</option>
                        <option value="IMP" th:selected="${rfqType == 'IMP'}">Import</option>
                    </select>
                </div>
                <div class="vr-filter-field">
                    <label>Status</label>
                    <select class="form-control" id="f_type">
                        <option value="ALL" th:selected="${type == 'ALL'}">All</option>
                        <option th:unless="${isVendor}" value="Act" th:selected="${type == 'Act'}">To Approve</option>
                        <option th:if="${isVendor}" value="New" th:selected="${type == 'New'}">To Quote</option>
                        <option value="Req" th:selected="${type == 'Req'}">Requote</option>
                        <option value="Apr" th:selected="${type == 'Apr'}">Approved</option>
                        <option value="Rej" th:selected="${type == 'Rej'}">Rejected</option>
                        <option value="Exp" th:selected="${type == 'Exp'}">Expired</option>
                        <option value="List" th:selected="${type == 'List'}" th:text="${isVendor} ? 'At Buyer' : 'At Vendor'">At Vendor</option>
                    </select>
                </div>
                <div class="vr-filter-field">
                    <button type="button" class="vr-go-btn" onclick="reloadTable()">Go <i class="fa fa-paper-plane"></i></button>
                </div>
            </form>

            <div class="vr-table-wrap">
                <table class="vr-table" id="rfqTable" style="width:100%">
                    <thead>
                    <tr>
                        <th>RFQ</th>
                        <th>QCF No</th>
                        <th>Title</th>
                        <th>PR No</th>
                        <th>RFQ Date</th>
                        <th>Vendor</th>
                        <th>Purchasing Group</th>
                        <th>Buyer</th>
                        <th>RFQ Closing Date</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="vr-legend">
                <span><i style="background:#58fb30"></i>Online</span>
                <span><i style="background:#30c3fb"></i>Offline</span>
                <span><i style="background:#f5b43d"></i>To Approve</span>
                <span><i style="background:#bb981894"></i>Requote</span>
                <span><i style="background:#2abb1894"></i>Approved</span>
                <span><i style="background:#ef5a618f"></i>Rejected</span>
                <span><i style="background:#bdb7b7ed"></i>Expired</span>
                <span><i style="background:#f1df09ed"></i>At Vendor</span>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="scriptContent">
    <script th:src="@{/resources/lte3dot2/plugins/datatables/jquery.dataTables.min.js}"></script>
    <script th:src="@{/resources/lte3dot2/plugins/datatables-bs4/js/dataTables.bootstrap4.min.js}"></script>
    <script th:inline="javascript">
        var rfqTable = null;
        var isVendorUser = /*[[${isVendor}]]*/ false;

        $(function () {
            rfqTable = $('#rfqTable').DataTable({
                serverSide: true,
                processing: true,
                pageLength: 10,
                order: [ [0, 'desc'] ],
                ajax: {
                    url: '/rfq/list/datatable',
                    data: function (d) {
                        d.type = $('#f_type').val();
                        d.rfqType = $('#f_rfqType').length ? $('#f_rfqType').val() : 'DOM';
                        d.fromDate = $('#f_fromDate').val();
                        d.toDate = $('#f_toDate').val();
                    }
                },
                columns: [
                    { data: 'rfqNo', render: function (rfqNo, type, row) {
                        return '<a href="/rfq/view/' + rfqNo + '?type=' + row.listType + '&rfqType=' + row.rfqType + '">' + rfqNo + '</a>';
                    } },
                    { data: 'collectiveRfqNo' },
                    { data: 'qcfTitle' },
                    { data: 'prNo' },
                    { data: 'rfqDate' },
                    { data: 'vendorLabel' },
                    { data: 'purGrpLabel' },
                    { data: 'buyer' },
                    { data: 'closingDate' },
                    { data: 'status', render: function (status, type, row) {
                        var color = row.statusColor || '';
                        return '<span style="display:inline-block;padding:2px 10px;border-radius:999px;background:' + color + '">' + status + '</span>';
                    } }
                ],
                rowCallback: function (row, data) {
                    if (!isVendorUser && data.quoteIndColor) {
                        $('td:eq(0)', row).css('background-color', data.quoteIndColor);
                    }
                },
                language: { searchPlaceholder: 'Search...', search: '' }
            });
        });

        function reloadTable() {
            rfqTable.ajax.reload();
        }
    </script>
</div>
</body>
</html>
