<html xmlns:th="http://www.thymeleaf.org"

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">ARAGEN | Aragen Digita X</title>

    <!-- Google Font: Source Sans Pro -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <!-- Font Awesome -->
    <link rel="stylesheet" th:href="@{/resources/lte3dot2/plugins/fontawesome-free/css/all.min.css}"/>
    <!-- DataTables -->
    <link rel="stylesheet" th:href="@{/resources/lte3dot2/plugins/datatables-bs4/css/dataTables.bootstrap4.min.css}"/>
    <link rel="stylesheet" th:href="@{/resources/lte3dot2/plugins/datatables-responsive/css/responsive.bootstrap4.min.css}"/>
    <link rel="stylesheet" th:href="@{/resources/lte3dot2/plugins/datatables-buttons/css/buttons.bootstrap4.min.css}"/>

    <link rel="stylesheet" th:href="@{/resources/lte3dot2/plugins/jquery-ui/jquery-ui.min.css}"/>
    <link rel="stylesheet" th:href="@{/resources/lte3dot2/plugins/select2/css/select2.min.css}"/>
    <link rel="stylesheet" th:href="@{/resources/lte3dot2/plugins/select2-bootstrap4-theme/select2-bootstrap4.min.css}"/>
    <!-- daterange picker -->
    <link rel="stylesheet" th:href="@{/resources/lte3dot2/plugins/daterangepicker/daterangepicker.css}"/>
    <!-- Theme style -->
    <link rel="stylesheet" th:href="@{/resources/lte3dot2/css/adminlte.min.css}"/>

    <link rel="stylesheet" th:href="@{/resources/lte3dot2/plugins/validation/validationEngine.jquery.css}"/>
    <link rel="stylesheet" th:href="@{/resources/lte3dot2/plugins/pace-progress/themes/black/pace-theme-flat-top.css}"/>
    <link rel="stylesheet" th:href="@{/resources/plugins/datepicker/datepicker3.css}"/>
    <style>
        th{
             background-color: #3b4a5e;
           color: #fff;
       }


       /* Loader overlay (consolidated) */
       #loader {
         display: none; /* hidden until DOM is ready */
         /* positioned relative to the content container (not the viewport) */
         position: fixed;
         top: 0;
         left: 0;
         right: 0;
         bottom: 0;
         background-color: rgba(255,255,255,0.95);
         z-index: 1037; /* sits above content but below global UI like modals if needed */
         display: flex;
         justify-content: center;
         align-items: center;
       }

       /* Ensure the content container is the positioning context for the loader */
       section.content {
         position: relative;
       }

       .loader-content {
         text-align: center;
       }

       .loader-content img {
         width: auto;
         height: 324px;
         display: block;
       }


       .dashboard-bg {
           position: relative;
           z-index: 1;
       }

       .dashboard-bg::before {
           content: "";
           position: absolute;
           top: 0;
           left: 0;
           right: 0;
           bottom: 0;
           background: url("../resources/images/dashboard-bg.png") no-repeat center center;
           background-size: cover;
           opacity: 0.6;
           z-index: -1;
       }

       /* Define custom theme colors - site-wide "blue" is now the same deep charcoal-slate
          family as the sidebar/login, so every page (RFQ, QCF, Vendor Registration, PR, SES,
          Reservation...) reads as one consistent theme instead of two different color worlds. */
       :root {
         --blue-color: #1f2937;
         --blue-color-light: #3b4a5e;
         --orange-color: #DC402B;
         --sidebar-bg-1: #1f2937;
         --sidebar-bg-2: #161d29;
         --sidebar-bg-3: #0d1420;
         --sidebar-accent: #3b4a5e;
         /* Lighter slate for the dropdown-section pills (Purchase Requisition, RFQ, etc.). */
         --sidebar-pill-bg: #2d3f55;
       }

       /* Page-specific overrides */
       body.custom-page {
         background-color: var(--blue-color);
         color: white;
       }

       /* Sidebar container */
       aside.main-sidebar {
         /* keep AdminLTE default width (no override here) */
         background:
           radial-gradient(900px 600px at 20% -10%, var(--sidebar-accent) 0%, transparent 60%),
           linear-gradient(165deg, var(--sidebar-bg-1) 0%, var(--sidebar-bg-2) 55%, var(--sidebar-bg-3) 100%) !important;
         position: fixed;
         top: 0;
         left: 0;
         height: 100vh;
         color: white;
         overflow: hidden;
       }

       /* Brand link (logo area at top of sidebar) - transparent so the animated background
          shows through uniformly behind the logo too, instead of a flat patch. */
       aside.main-sidebar .brand-link {
         background: transparent !important;
         position: relative;
         z-index: 2;
         color: #fff !important;
         border-bottom: 1px solid rgba(255, 255, 255, 0.1); /* subtle line */
         text-align: center;
         padding: 15px;
       }

       /* ---- Sidebar animated background (mirrors the login page's treatment, scaled down for
            a narrow fixed column, in the sidebar's own slate-charcoal palette) ---- */
       .sidebar-bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
       .sidebar-bg .grid {
         position: absolute; inset: -44px; opacity: .06;
         background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
         background-size: 36px 36px; animation: sbGridPan 20s linear infinite;
         mask-image: radial-gradient(ellipse at 30% 30%, #000 0%, transparent 75%);
       }
       @keyframes sbGridPan { to { transform: translate(36px, 36px); } }
       .sidebar-bg .blob { position: absolute; border-radius: 50%; filter: blur(50px); opacity: .5; mix-blend-mode: screen; }
       .sidebar-bg .blob.b1 { width: 230px; height: 230px; background: #4a5568; left: -70px; top: -40px; animation: sbDrift1 24s ease-in-out infinite alternate; }
       .sidebar-bg .blob.b2 { width: 200px; height: 200px; background: #3b4a5e; right: -80px; top: 42%; opacity: .4; animation: sbDrift2 28s ease-in-out infinite alternate; }
       .sidebar-bg .blob.b3 { width: 190px; height: 190px; background: #2d3a4a; left: -50px; bottom: -60px; opacity: .45; animation: sbDrift3 32s ease-in-out infinite alternate; }
       @keyframes sbDrift1 { to { transform: translate(60px, 80px) scale(1.15); } }
       @keyframes sbDrift2 { to { transform: translate(-50px, -60px) scale(.9); } }
       @keyframes sbDrift3 { to { transform: translate(40px, -70px) scale(1.2); } }
       .sidebar-bg .ring { position: absolute; border-radius: 50%; border: 1px dashed rgba(255, 255, 255, .1); }
       .sidebar-bg .ring.r1 { width: 320px; height: 320px; left: -40%; bottom: -18%; animation: sbSpin 100s linear infinite; }
       .sidebar-bg .ring.r2 { width: 440px; height: 440px; left: -60%; bottom: -26%; border-style: solid; border-color: rgba(255, 255, 255, .04); animation: sbSpin 160s linear infinite reverse; }
       @keyframes sbSpin { to { transform: rotate(360deg); } }
       #sidebarNet { position: absolute; inset: 0; width: 100%; height: 100%; }
       .sidebar-bg .sweep {
         position: absolute; inset: 0;
         background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, .05) 50%, transparent 60%);
         background-size: 250% 100%; animation: sbSweep 11s ease-in-out infinite;
       }
       @keyframes sbSweep { 0% { background-position: 120% 0; } 60%, 100% { background-position: -120% 0; } }
       @media (prefers-reduced-motion: reduce) {
         .sidebar-bg .grid, .sidebar-bg .blob, .sidebar-bg .ring, .sidebar-bg .sweep { animation: none !important; }
       }

       /* Sidebar content (logo + nav) sits above the animated background layer. */
       aside.main-sidebar > .sidebar { position: relative; z-index: 2; }

       /* Text wordmark in the brand area, replacing the old logo image - same style as the
          login page's wordmark. */
       .sidebar-wordmark {
         font-weight: 800;
         font-size: 22px;
         letter-spacing: .04em;
       }
       .sidebar-wordmark small {
         display: block;
         font-size: 9px;
         font-weight: 600;
         letter-spacing: .28em;
         opacity: .75;
         margin-top: 2px;
       }

       /* Sidebar nav links */
       .custom-sidebar .nav-link {
         display: block;
         padding: 12px 20px;
         color: white !important;
         font-size: 15px;
         text-decoration: none;
       }

       .custom-sidebar .nav-link {
         position: relative;
         transition: all 0.3s ease;
         border-radius: 0; /* square tiles, not pills */
         padding: 8px 16px;
       }

       .custom-sidebar .nav-link:hover {
         background-color: #000 !important;
         color: #fff !important; /* White text */
         transition: all 0.3s ease;
       }

       .custom-sidebar .nav-link.active {
         background-color: #000 !important;
         color: #fff !important; /* White text */
         transition: all 0.3s ease;
       }

       /* Treeview parent links (the expandable "Vendor Registration", "Budget Price", etc.
          sections) all use href="#" - their real leaf links use th:href, so this attribute
          selector reliably targets only the dropdown toggles without touching plain items.
          Transparent (not a solid pill) so the animated background shows through; a faint
          border + separator still reads them as distinct tiles without going opaque. */
       .custom-sidebar .nav-link[href="#"] {
         background-color: transparent !important;
         border: 1px solid rgba(255, 255, 255, 0.08);
         border-bottom: 1px solid rgba(255, 255, 255, 0.06);
       }

       /* ---- Dashboard content area - same charcoal/slate color family as the sidebar and
            login page, but LIGHT (the rest of the site stays light; only the sidebar/login are
            dark). Replaces AdminLTE's default saturated bg-warning/bg-info/bg-aqua stat-card
            colors with a consistent slate palette, differentiated by a left accent bar + icon
            color instead of a solid loud background. ---- */
       .content-wrapper {
         background: linear-gradient(165deg, #f6f7f9 0%, #eef1f4 100%) !important;
       }

       .small-box {
         position: relative;
         background: #fff;
         border: 1px solid #e3e7ec;
         border-radius: 8px;
         box-shadow: 0 1px 3px rgba(15, 23, 32, .06);
         color: #1f2937;
         overflow: hidden;
         opacity: 0;
         transform: translateY(14px);
         animation: dashCardIn .5s cubic-bezier(.22, 1, .36, 1) forwards;
         transition: box-shadow .25s ease, transform .25s ease;
       }
       .small-box:hover {
         box-shadow: 0 10px 24px rgba(15, 23, 32, .14);
         transform: translateY(-4px);
       }
       @keyframes dashCardIn {
         to { opacity: 1; transform: translateY(0); }
       }
       /* Staggered reveal across each row's columns - gives the grid a wave-in effect on load. */
       .row > div:nth-of-type(1) .small-box { animation-delay: .02s; }
       .row > div:nth-of-type(2) .small-box { animation-delay: .09s; }
       .row > div:nth-of-type(3) .small-box { animation-delay: .16s; }
       .row > div:nth-of-type(4) .small-box { animation-delay: .23s; }

       .small-box .inner { position: relative; z-index: 1; padding: 20px 20px 14px; }
       .small-box .inner h3 {
         color: #1f2937;
         font-weight: 800;
         font-variant-numeric: tabular-nums;
         transition: color .2s ease;
       }
       .small-box .inner p { color: #5b6472; margin-bottom: 0; }

       /* Turn AdminLTE's giant faded corner icon into a small circular badge, colored per
          category and lifted slightly on hover for a bit of life. */
       .small-box .icon {
         position: absolute;
         top: 16px; right: 16px;
         width: 46px; height: 46px;
         display: flex; align-items: center; justify-content: center;
         border-radius: 50%;
         background: rgba(59, 74, 94, .08);
         color: #3b4a5e;
         font-size: 18px !important;
         opacity: 1;
         transition: transform .3s ease, background .3s ease;
       }
       .small-box .icon > i { font-size: 18px; }
       .small-box:hover .icon { transform: scale(1.12) rotate(6deg); }

       .small-box-footer {
         position: relative; z-index: 1;
         background: #f3f5f8 !important;
         color: #3b4a5e !important;
         border-top: 1px solid #e3e7ec;
         transition: background .2s ease, color .2s ease;
       }
       .small-box-footer:hover { background: #eceff3 !important; color: #1f2937 !important; }
       .small-box-footer i { display: inline-block; transition: transform .2s ease; }
       .small-box-footer:hover i { transform: translateX(4px); }

       .small-box.bg-warning, .small-box.bg-info, .small-box.bg-aqua {
         background: #fff !important;
         color: #1f2937 !important;
       }
       .small-box.bg-warning { border-left: 4px solid #c8893a; }
       .small-box.bg-info { border-left: 4px solid #3b4a5e; }
       .small-box.bg-aqua { border-left: 4px solid #2d3f55; }
       .small-box.bg-warning .icon { background: rgba(200, 137, 58, .12); color: #c8893a; }
       .small-box.bg-info .icon { background: rgba(59, 74, 94, .12); color: #3b4a5e; }
       .small-box.bg-aqua .icon { background: rgba(45, 63, 85, .12); color: #2d3f55; }
       .small-box.bg-warning .inner h3 { color: #c8893a; }
       .small-box.bg-info .inner h3 { color: #3b4a5e; }
       .small-box.bg-aqua .inner h3 { color: #2d3f55; }

       .content-wrapper .card {
         border: 1px solid #e3e7ec;
         border-radius: 8px;
         box-shadow: 0 1px 3px rgba(15, 23, 32, .05);
         opacity: 0;
         transform: translateY(14px);
         animation: dashCardIn .55s cubic-bezier(.22, 1, .36, 1) .3s forwards;
         transition: box-shadow .25s ease;
       }
       .content-wrapper .card:hover {
         box-shadow: 0 10px 26px rgba(15, 23, 32, .1);
       }
       .content-wrapper .card-header {
         background: #fff;
         border-bottom: 1px solid #e3e7ec;
       }
       .content-wrapper .card-header h5 {
         color: #1f2937;
         font-weight: 700;
       }

       @media (prefers-reduced-motion: reduce) {
         .small-box, .content-wrapper .card {
           animation: none !important;
           opacity: 1 !important;
           transform: none !important;
         }
       }

       /* Site-wide charcoal theme polish: every "vr-" page (RFQ/QCF/Vendor Registration/PR/SES/
          Reservation...) already sets its own hover end-states (transform/background/color) per
          page, but without a transition those snap instantly. Adding the transition here, once,
          turns all of them into smooth animations without having to touch every page's own
          <style> block - and keeps the whole site feeling uniform. */
       .vr-card-header, .vr-crit-label, .vr-step, .vr-vendor-tab,
       .vr-btn-primary, .vr-btn-light, .vr-btn-reject, .vr-btn-sendback,
       .vr-btn-hierarchy, .vr-btn-audit, .vr-btn-post {
         transition: transform .2s ease, box-shadow .2s ease, background .25s ease,
                     color .2s ease, border-color .2s ease, opacity .2s ease;
       }
       .vr-btn-primary:hover, .vr-btn-post:hover {
         box-shadow: 0 8px 20px rgba(31, 41, 55, .25);
       }
       .vr-btn-light:hover, .vr-btn-reject:hover, .vr-btn-sendback:hover,
       .vr-btn-hierarchy:hover, .vr-btn-audit:hover {
         transform: translateY(-1px);
         box-shadow: 0 4px 12px rgba(31, 41, 55, .12);
       }
       .vr-vendor-tab:hover { background: #e3e7ec; }
       .vr-card-header {
         opacity: 0;
         transform: translateY(-8px);
         animation: dashCardIn .45s cubic-bezier(.22, 1, .36, 1) forwards;
       }
       @media (prefers-reduced-motion: reduce) {
         .vr-card-header { animation: none !important; opacity: 1 !important; transform: none !important; }
       }

       .loader {
         position: relative;
         transform: rotateZ(45deg);
         border-radius: 50%;
         width: 100px;
         height: 100px;
         color: var(--blue-color);
       }

       .loader:before,
       .loader:after {
         content: '';
         display: block;
         position: absolute;
         top: 0;
         left: 0;
         width: inherit;
         height: inherit;
         border-radius: 50%;
         transform: rotateX(70deg);
         animation: spin 1s linear infinite;
       }

       .loader:after {
         color: var(--orange-color);
         transform: rotateY(70deg);
         animation-delay: .4s;
       }

       @keyframes spin {
         0%,100% { box-shadow: .25em 0 0 0 currentcolor; }
         12% { box-shadow: .25em .25em 0 0 currentcolor; }
         25% { box-shadow: 0 .25em 0 0 currentcolor; }
         37% { box-shadow: -.25em .25em 0 0 currentcolor; }
         50% { box-shadow: -.25em 0 0 0 currentcolor; }
         62% { box-shadow: -.25em -.25em 0 0 currentcolor; }
         75% { box-shadow: 0 -.25em 0 0 currentcolor; }
         87% { box-shadow: .25em -.25em 0 0 currentcolor; }
       }

       /* Kill Pace’s old loader completely */
       .pace-running::before,
       .pace, .pace .pace-progress, .pace .pace-activity {
         display: none !important;
         content: none !important;
         background: none !important;
       }





    </style>

    <!-- html -->
    <!-- Put this script in the <head> (replaces existing loader JS) -->
    <script>
        const loader = {
          start: function() {
            console.log('START LOADER');
            const el = document.getElementById('loader');
            if (el) el.style.display = 'flex';
          },
          stop: function() {
            console.log('STOP LOADER');
            const el = document.getElementById('loader');
            if (el) el.style.display = 'none';
          }
        };

        // Show loader as soon as DOM is available, then hide when full page loads
        document.addEventListener('DOMContentLoaded', function() {
          // small timeout to ensure the loader element is parsed in body
          setTimeout(() => loader.start(), 10);
        });

        // Hide loader when everything (images, subresources) has loaded
        window.addEventListener('load', function() {
          // add slight delay so the user sees the loader briefly on slow pages
          setTimeout(() => loader.stop(), 150);
        });

         const warningTime = 25 * 60 * 1000;
         const logoutTime = 30 * 60 * 1000;
         let warningTimer, logoutTimer;

         function startTimers() {
           clearTimers();

           warningTimer = setTimeout(() => {
             const stayLoggedIn = confirm("You will be signed out soon. Do you want to stay logged in?");
             if (stayLoggedIn) {
               const csrfTokenEl = document.getElementById("csrf");
               const csrfToken = csrfTokenEl ? csrfTokenEl.value : null;
               fetch('/api/session/extend', {
                 method: 'POST',
                 headers: {
                   'Content-Type': 'application/json',
                   'X-CSRF-TOKEN': csrfToken
                 }
               })
               .then(response => {
                 if (response.ok) {
                   console.log("Session extended successfully.");
                   localStorage.setItem("session-extended", Date.now());
                   startTimers();
                 } else {
                   console.error("Failed to extend session.");
                 }
               })
               .catch(error => console.error("Error extending session:", error));
             } else {
               localStorage.setItem("force-logout", Date.now());
               logout();
             }
           }, warningTime);

           logoutTimer = setTimeout(() => {
             localStorage.setItem("force-logout", Date.now());
             logout();
           }, logoutTime);
         }

         function clearTimers() {
           clearTimeout(warningTimer);
           clearTimeout(logoutTimer);
         }

         function logout() {
           alert("You have been signed out.");
           window.location.href = "/logout.html?logSucc=true";
         }

         window.addEventListener("storage", (event) => {
           if (event.key === "session-extended") {
             console.log("Session extended in another tab. Resetting timers...");
             startTimers();
           }
           if (event.key === "force-logout") {
             console.log("Logout triggered from another tab.");
             logout();
           }
         });

         startTimers();
    </script>

</head>

<!-- Count-up animation for any dashboard stat tile (.small-box h3 with a plain integer) - purely
     cosmetic, degrades silently to the static number for non-numeric content (e.g. currency
     strings) since it bails out when parseInt fails. -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        document.querySelectorAll('.small-box .inner h3').forEach(function (el) {
            var target = parseInt((el.textContent || '').replace(/[^0-9-]/g, ''), 10);
            if (isNaN(target)) { return; }
            if (reduce) { el.textContent = target; return; }
            var start = null;
            var duration = 700 + Math.min(target, 40) * 10;
            function step(ts) {
                if (!start) { start = ts; }
                var p = Math.min((ts - start) / duration, 1);
                var eased = 1 - Math.pow(1 - p, 3);
                el.textContent = Math.round(eased * target);
                if (p < 1) { requestAnimationFrame(step); }
            }
            requestAnimationFrame(step);
        });
    });
</script>
