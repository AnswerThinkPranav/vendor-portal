<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      layout:decorate="layout">
<head>
    <meta charset="UTF-8">
    <title>New Vendors</title>

    <style>
        .vr-breadcrumb { font-size: 13px; color: #6c7a91; margin-bottom: 18px; letter-spacing: .2px; }
        .vr-breadcrumb .current { color: var(--blue-color); font-weight: 600; }

        .vr-card { background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(3, 56, 130, 0.08); overflow: hidden; width: 100%; margin: 0 0 24px 0; }
        .vr-card-header { background: linear-gradient(120deg, var(--blue-color) 0%, #0a4fae 100%); color: #fff; padding: 18px 28px; }
        .vr-card-header h4 { margin: 0; font-weight: 700; letter-spacing: .3px; }
        .vr-card-header p { margin: 2px 0 0 0; opacity: .85; font-size: 13px; }

        .vr-filter-bar {
            display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px;
            padding: 18px 28px; border-bottom: 1px solid #eef1f6; background: #fbfcfe;
        }
        .vr-filter-field { display: flex; flex-direction: column; gap: 4px; }
        .vr-filter-field label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: #7c879b; }
        .vr-filter-field .form-control { border-radius: 9px; border: 1px solid #dde3ec; height: 36px; font-size: 13.5px; box-shadow: none; }
        .vr-filter-field .form-control:focus { border-color: var(--blue-color); box-shadow: 0 0 0 3px rgba(3, 56, 130, 0.12); }
        .vr-go-btn {
            background: linear-gradient(120deg, var(--blue-color), #0a4fae); border: none; border-radius: 9px;
            padding: 8px 20px; font-weight: 600; color: #fff; height: 36px; font-size: 13.5px;
        }
        .vr-go-btn:hover { color: #fff; transform: translateY(-1px); }

        .vr-table-wrap { padding: 6px 28px 24px 28px; overflow-x: auto; }
        table.vr-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
        table.vr-table thead th {
            background: #f5f7fb; color: #4b5876; font-weight: 700; text-transform: uppercase;
            font-size: 11px; letter-spacing: .4px; padding: 10px 14px; text-align: left; border-bottom: 2px solid #e7ecf3;
        }
        table.vr-table tbody td { padding: 11px 14px; border-bottom: 1px solid #f0f2f7; color: #2c3648; }
        table.vr-table tbody tr:hover { background: #f9fbfe; }
        .vr-doc-id { font-weight: 700; color: var(--blue-color); }
        .vr-status-pill {
            display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .3px;
        }
        .vr-status-INITIATED { background: #eaf1fd; color: #2054a6; }
        .vr-status-RESUBMITTED { background: #fff2e0; color: #b5690a; }
        .vr-empty { padding: 50px 20px; text-align: center; color: #8b96ab; }
        .vr-empty i { font-size: 34px; opacity: .5; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <div class="vr-breadcrumb">Vendor Registration &nbsp;/&nbsp; <span class="current">New</span></div>

        <div class="vr-card">
            <div class="vr-card-header">
                <h4>New</h4>
                <p>Vendors you've invited (see Invite Vendor)</p>
            </div>

            <form class="vr-filter-bar" method="get" th:action="@{/vendorReg/new}">
                <div class="vr-filter-field">
                    <label>From Date</label>
                    <input type="date" class="form-control" name="fromDate" th:value="${fromDate}">
                </div>
                <div class="vr-filter-field">
                    <label>To Date</label>
                    <input type="date" class="form-control" name="toDate" th:value="${toDate}">
                </div>
                <div class="vr-filter-field">
                    <label>Type</label>
                    <select class="form-control" name="venType">
                        <option value="IN" th:selected="${venType == 'IN'}">Domestic</option>
                        <option value="IM" th:selected="${venType == 'IM'}">Import</option>
                    </select>
                </div>
                <div class="vr-filter-field">
                    <label>Status</label>
                    <select class="form-control" name="type">
                        <option value="ALL" th:selected="${type == 'ALL'}">All</option>
                        <option value="Reg" th:selected="${type == 'Reg'}">To Register</option>
                        <option value="Res" th:selected="${type == 'Res'}">To ReSubmit</option>
                    </select>
                </div>
                <div class="vr-filter-field">
                    <button type="submit" class="vr-go-btn">Go <i class="fa fa-paper-plane"></i></button>
                </div>
            </form>

            <div class="vr-table-wrap">
                <table class="vr-table" th:if="${not #lists.isEmpty(rows)}">
                    <thead>
                    <tr>
                        <th>Vendor</th>
                        <th>Name</th>
                        <th>Pur Org</th>
                        <th>Initiator</th>
                        <th>Created On</th>
                        <th>Changed On</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="row : ${rows}">
                        <td><a class="vr-doc-id" th:href="@{/vendorReg/register/{id}(id=${row.docId})}" th:text="${row.docId}"></a></td>
                        <td th:text="${#strings.toUpperCase(row.custName)}"></td>
                        <td th:text="${row.purOrg}"></td>
                        <td th:text="${row.createdBy}"></td>
                        <td th:text="${#temporals.format(row.createdOn, 'dd/MM/yyyy')}"></td>
                        <td th:text="${row.modifiedOn != null ? #temporals.format(row.modifiedOn, 'dd/MM/yyyy') : ''}"></td>
                        <td><span class="vr-status-pill" th:classappend="'vr-status-' + ${row.status}" th:text="${row.status}"></span></td>
                    </tr>
                    </tbody>
                </table>
                <div class="vr-empty" th:if="${#lists.isEmpty(rows)}">
                    <i class="fa fa-inbox"></i>
                    No vendors found for this filter.
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
