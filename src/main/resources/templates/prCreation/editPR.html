<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      layout:decorate="layout">
<head>
    <meta charset="UTF-8">
    <title>Edit PR</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/4.6.0/css/bootstrap.min.css}"/>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <style>
        /* ... existing styles ... */

        /* Column width tweaks */
        th.storage-col, td.storage-col {
          width: 220px;       /* increase storage location width */
          min-width: 160px;
        }

        th.qty-col, td.qty-col {
          width: 80px;        /* decrease quantity width */
          min-width: 60px;
        }

        /* ensure inputs/selects fit the cell */
        td.qty-col input.form-control { padding: 4px; width: 100%; box-sizing: border-box; }
        td.storage-col .form-control { width: 100%; box-sizing: border-box; }
    </style>
    <style>
        /* (kept your original styles) */
        .container { max-width: 1200px; margin: 0 auto; }
        .card { padding: 20px; width: 100%; }
        .filter-panel { background: #DC402B; border-radius: 8px; overflow: hidden; width: 100%; }
        .filter-header { padding: 12px 20px; color: white; font-weight: bold; display:flex; align-items:center; justify-content:space-between; background-color: rgba(220,64,43,0.85); }
        .filter-title { display:flex; align-items:center; gap:8px; }
        .filter-content { background: rgba(255,255,255,0.95); padding:15px 20px; border-radius:0 0 8px 8px; display:block; }
        .custom-table-header { background-color: #033882; color: #fff; }
        table th, table td { vertical-align: middle; padding:6px; }
        .btn-create { background-color: #033882; color: white; font-size: 16px; padding: 10px 25px; border-radius: 6px; border: none; cursor: pointer; transition: 0.3s; }
        .btn-create:hover { background-color: #022b65; }
        /* item table scroll & widths (same as yours) */
        #itemTable input.form-control { min-width: 100px; padding: 4px 6px; font-size: 13px; }
        #itemTable th, #itemTable td { vertical-align: middle; padding: 6px 10px; text-align: center; }
        .table-scroll { max-height: 360px; overflow-x: auto; overflow-y: auto; width:100%; padding-bottom:8px; }
        #itemTable thead th { position: sticky; top: 0; z-index: 4; background-color: #033882; color: white; }
        .sub-row {
            background-color: #f9f9f9;
            display: none;
        }
        /* Ensure main rows are always visible unless explicitly marked as deleted */
        #itemTable tbody tr:not(.sub-row) {
            display: table-row;
        }
        #itemTable tbody tr:not(.sub-row)[style*="display: none"] {
            /* Only hide if explicitly set to none (for deleted items) */
        }

        /* Styling for deleted items (delInd = 'X') */
        .deleted-item-row {
            background-color: #ffcccc !important; /* Light red background */
        }

        .deleted-item-row input,
        .deleted-item-row select,
        .deleted-item-row textarea {
            background-color: #ffe6e6 !important; /* Slightly lighter red for inputs */
            cursor: not-allowed !important;
        }

        .deleted-item-row .btn {
            pointer-events: none !important;
            opacity: 0.5 !important;
        }
    </style>
</head>

<body>
<section layout:fragment="header">
    <div class="container">
        <div class="row mb-2">
            <div class="col-sm-6">
                <h1 style="display:flex; align-items:baseline; gap:12px;">
                    <span>Edit PR</span>
                    <span th:if="${prHeader != null and prHeader.reqNumber != null}" th:text="${prHeader.reqNumber}" style="font-weight:400; font-size:inherit; color:#333; opacity:0.95;"></span>
                </h1>
            </div>
            <div class="col-sm-6">
                <ol class="breadcrumb float-sm-right">
                    <li class="breadcrumb-item"><a th:href="@{/prCreate/list}">PR</a></li>
                    <li class="breadcrumb-item active">Edit PR</li>
                </ol>
            </div>
        </div>
    </div>
</section>

<div class="container" layout:fragment="content">
    <div class="card">
        <!-- PR Header panel (same UI as Create PR) -->
        <div class="filter-panel mt-3">
            <div class="filter-header">
                <div class="filter-title">
                    <i class="bi bi-pencil-square"></i>
                    <span>PR Header Details</span>
                </div>

                <div style="display:flex; align-items:center; gap:8px; justify-content:center;">
                    <label style="color:white; margin-bottom:0;">Document Type:</label>
                    <select id="docType" class="form-control searchable-dropdown" style="width:200px;"
                            th:field="*{docType}" th:object="${prHeader}">
                        <option value="">-- Select Doc Type --</option>
                        <option th:each="dt : ${docTypes ?: {}}"
                                th:value="${dt.emdValue1}"
                                th:text="${dt.emdValue2 + ' (' + dt.emdValue1 + ')'}">
                        </option>
                    </select>
                </div>

                <i id="toggleIcon" class="bi bi-chevron-up filter-icon" title="Collapse/Expand" onclick="toggleHeaderSection()"></i>
            </div>
        </div>

        <!-- Bind form to prHeader -->
        <form th:action="@{/prCreate/update}" th:object="${prHeader}" method="post" id="prForm">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <!-- Keep reqNumber available for scripts/back-end as a hidden bound field -->
            <input type="hidden" th:field="*{reqNumber}" name="reqNumber" />
            <div class="filter-content" id="headerContent">
                <div class="row mb-3">
                    <div class="form-group col-md-4">
                        <label>Plant</label>
                        <select class="form-control searchable-dropdown" th:field="*{plant}" id="plant" name="plant" onchange="loadDepartments();">
                            <option value="">--Select Plant--</option>
                            <option th:each="pt : ${plants ?: {}}"
                                    th:value="${pt.emdValue1}"
                                    th:text="${pt.emdValue2 + ' (' + pt.emdValue1 + ')'}"></option>
                        </select>
                    </div>
                    <div class="form-group col-md-4">
                        <label>Purchase Group</label>
                        <select class="form-control searchable-dropdown" th:field="*{purGrp}" id="purGrp" name="purGrp">
                            <option value="">-- Select Purchase Group --</option>
                            <option th:each="pg : ${purchaseGroups ?: {}}"
                                    th:value="${pg.emdValue1}"
                                    th:text="${pg.emdValue2 + ' (' + pg.emdValue1 + ')'}"></option>
                        </select>
                    </div>
                    <div class="form-group col-md-4">
                        <label>Account Assignment</label>
                        <select class="form-control searchable-dropdown" th:field="*{accAsmt}" id="accAsmt" name="accAsmt" onchange="toggleWbsInternalOrder()">
                            <option value="">-- Select Account Assignment Group --</option>
                            <option th:each="aa : ${accAssgs ?: {}}"
                                    th:value="${aa.emdValue1}"
                                    th:text="${aa.emdValue2 + ' (' + aa.emdValue1 + ')'}"></option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="form-group col-md-4">
                        <label>Item Category</label>
                        <select class="form-control searchable-dropdown" th:field="*{itemCat}" id="itemCat" name="itemCat">
                            <option value="">-- Select Item Category --</option>
                            <option th:each="ic : ${itemCategs ?: {}}"
                                    th:value="${ic.emdValue1}"
                                    th:text="${ic.emdValue2 + ' (' + ic.emdValue1 + ')'}"></option>
                        </select>
                    </div>

                    <div class="form-group col-md-4">
                        <label>Division</label>
                        <select class="form-control searchable-dropdown" th:field="*{division}" id="division" name="division" onchange="loadDepartments();">
                            <option value="">-- Select Division --</option>
                            <option th:each="d : ${divisions ?: {}}"
                                    th:value="${d.emdValue1}"
                                    th:text="${d.emdValue2 + ' (' + d.emdValue1 + ')'}"></option>
                            <!-- If prHeader.division exists but not in list, show it -->

                        </select>
                    </div>

                    <div class="form-group col-md-4">
                        <label>Department</label>
                        <select id="department" th:field="*{dept}" name="department" class="form-control searchable-dropdown">
                            <option value="">-- Select Department --</option>
                            <!-- departments will be loaded by JS when division/plant are set -->
                            <option th:each="dpt : ${departments ?: {}}"
                                    th:value="${dpt.emdValue1}"
                                    th:text="${dpt.emdValue2}"
                                    th:selected="${prHeader != null and prHeader.dept != null and dpt.emdValue1 == prHeader.dept}">
                            </option>
                        </select>
                    </div>
                </div>
            </div> <!-- End of filter-content / headerContent -->

            <!-- keep form open because items are inside same form -->

            <!-- Item Table (initial rows are rendered server-side so user can amend) -->
            <div class="custom-table-container mt-4 table-scroll-wrapper">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="text-primary">Item Details</h5>
                    <button class="btn btn-success btn-sm" type="button" onclick="addItemRow()">
                        <i class="bi bi-plus-circle"></i> Add Item
                    </button>
                </div>

                <div class="table-scroll">
                    <table id="itemTable" class="table table-bordered table-hover text-center">
                        <thead class="custom-table-header">
                        <tr>
                            <th>Sr No.</th>
                            <th>Material Code</th>
                            <th>Description</th>
                            <th>UOM</th>
                            <th class="qty-col">Quantity</th>
                            <th >Unit Price</th>
                            <th>Total Value</th>
                            <th>Material Group</th>
                            <th>Delivery Date</th>
                            <th class="storage-col">Storage location</th>
                            <th>Tracking Number</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- render existing items for editing -->
                        <th:block th:each="item, istat : *{items}">
                            <tr class="itemRow" th:classappend="${item.delInd == 'X' ? 'deleted-item-row' : ''}">

                                <td>
                                    <span th:text="${(istat.index + 1) * 10}"></span>

                                    <input type="hidden" name="casNoHid" id="casNoHid" th:value="*{items[__${istat.index}__].cas}">
                                    <input type="hidden" name="status" value="A">
                                    <input type="hidden" th:field="*{items[__${istat.index}__].itemNO}" />
                                    <input type="hidden" th:field="*{items[__${istat.index}__].delInd}" />
                                </td>

                                <td style="width: 220px;">
                                    <input type="text" class="form-control" th:field="*{items[__${istat.index}__].matNumber}" name="matNumber" th:disabled="${item.delInd == 'X'}" />
                                </td>

                                <td style="width: 320px;">
                                    <input type="text" class="form-control" th:field="*{items[__${istat.index}__].shortText}"  name="shortText" th:disabled="${item.delInd == 'X'}" />
                                </td>

                                <td><input type="text" class="form-control" th:field="*{items[__${istat.index}__].uom}" name="uom" readonly th:disabled="${item.delInd == 'X'}" /></td>

                                <td><input type="number" class="form-control" th:field="*{items[__${istat.index}__].quantity}"  name="quantity" oninput="calcTotal(this)" th:disabled="${item.delInd == 'X'}" /></td>

                                <td><input type="number" step="0.01" class="form-control" th:field="*{items[__${istat.index}__].valPrice}"  name="valPrice" oninput="calcTotal(this)" th:disabled="${item.delInd == 'X'}" /></td>

                                <td><input type="text" class="form-control"  name="total" th:field="*{items[__${istat.index}__].total}" readonly th:disabled="${item.delInd == 'X'}" /></td>

                                <td><input type="text" class="form-control" th:field="*{items[__${istat.index}__].materialGroup}" name="materialGroup" readonly th:disabled="${item.delInd == 'X'}" /></td>

                                <!--  <td><input type="date" class="form-control" th:field="*{items[__${istat.index}__].deliveryDate}" name="deliveryDate" /></td>-->
                                <td>
                                    <input type="date"
                                           class="form-control"
                                           th:value="${#dates.format(item.deliveryDate, 'yyyy-MM-dd')}"
                                           name="items[__${istat.index}__].deliveryDate"
                                           th:disabled="${item.delInd == 'X'}" />
                                </td>


                                <td>
                                    <select class="form-control storageLoc-dropdown" th:field="*{items[__${istat.index}__].storageLoc}" name="storageLoc" th:disabled="${item.delInd == 'X'}">
                                        <option value="">-- Select Storage Loc --</option>
                                        <option th:each="loc : ${storgLocs}"
                                                th:value="${loc.emdValue1.split('#')[0]}"
                                                th:text="${loc.emdValue2 + ' (' + loc.emdValue1.split('#')[0] + ')'}"></option>
                                    </select>
                                </td>

                                <td><input type="text" class="form-control" th:field="*{items[__${istat.index}__].trackNo}" name="trackNo" th:disabled="${item.delInd == 'X'}" /></td>

                                <td>
                                    <div class="btn-group">
                                        <button class="btn btn-addinfo btn-sm" type="button" title="Add Info" onclick="toggleSubRow(this)" th:disabled="${item.delInd == 'X'}">
                                            <i class="bi bi-plus-circle"></i>
                                        </button>
                                        <button class="btn btn-delete btn-sm" type="button" title="Delete Row" onclick="deleteItemRow(this)" th:disabled="${item.delInd == 'X'}">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>

                            <!-- optional sub-row for extra item fields (rendered, hidden by default) -->
                            <tr class="sub-row" style="display: none;" th:classappend="${item.delInd == 'X' ? 'deleted-item-row' : ''}">
                                <td colspan="12">
                                    <div class="row">
                                        <div class="col-md-1">
                                            <label>Division</label>
                                            <input type="text" class="form-control" th:value="${prHeader.division}" name="diviItem" readonly th:disabled="${item.delInd == 'X'}" />
                                        </div>
                                        <div class="col-md-1">
                                            <label>Department</label>
                                            <input type="text" class="form-control" th:value="${prHeader.dept}" name="departItem" readonly th:disabled="${item.delInd == 'X'}" />
                                        </div>
                                        <div class="col-md-1">
                                            <label>CAS NO</label>
                                            <input type="text" name="cas" class="form-control" th:field="*{items[__${istat.index}__].cas}" th:disabled="${item.delInd == 'X'}" />
                                        </div>
                                        <div class="col-md-3 wbs-container">
                                            <label>WBS ELEMENT</label>
                                            <select th:field="*{items[__${istat.index}__].wbsElement}" class="form-control wbsElement-dd searchable-dropdown"
                                                    th:attr="data-selected=${item.wbsElement}, data-selected-text=${item.wbsElement}"
                                                    name="wbsElement" th:disabled="${item.delInd == 'X'}">
                                                <option value="">-- Select WBS Element --</option>
                                                <option th:each="wbs : ${wbsElements}"
                                                        th:value="${wbs.wbsCode}"
                                                        th:text="${wbs.wbsCodeDesc}"></option>
                                            </select>
                                        </div>
                                        <div class="col-md-3 internalOrder-container" style="display: none;">
                                            <label>INTERNAL ORDER</label>
                                            <select name="internalOrder" class="form-control internalOrder-dd" th:field="*{items[__${istat.index}__].internalOrder}" th:disabled="${item.delInd == 'X'}">
                                                <option value="">-- Select Internal Order --</option>
                                            </select>
                                        </div>
                                        <div class="col-md-3 network-container" style="display: none;">
                                            <label>NETWORK</label>
                                            <select name="network" class="form-control network-dd" th:field="*{items[__${istat.index}__].network}" th:disabled="${item.delInd == 'X'}">
                                                <option value="">-- Select Network --</option>
                                            </select>
                                        </div>
                                        <div class="col-md-3 costCenter-container" style="display: none;">
                                            <label>COST CENTER</label>
                                            <select name="costCenter" class="form-control costCenter-dd" th:field="*{items[__${istat.index}__].costCenter}" th:disabled="${item.delInd == 'X'}">
                                                <option value="">-- Select Cost Center --</option>
                                            </select>
                                        </div>
                                        <div class="col-md-2 reason-container">
                                            <label>REASON</label>
                                            <select name="reason" class="form-control reason-dd" th:field="*{items[__${istat.index}__].reason}" th:disabled="${item.delInd == 'X'}">
                                                <option value="">-- Select Reason --</option>
                                            </select>
                                        </div>
                                        <div class="col-md-1">
                                            <label>Pack size</label>
                                            <select class="form-control" th:field="*{items[__${istat.index}__].packSize}" name="packSize" th:disabled="${item.delInd == 'X'}">
                                                <option value="">-- Select --</option>
                                                <option value="0">0</option>
                                                <option value="5">5</option>
                                                <option value="10">10</option>
                                                <option value="25">25</option>
                                                <option value="100">100</option>
                                                <option value="200">200</option>
                                            </select>
                                        </div>
                                        <div class="col-md-1">
                                            <label>COA</label>
                                            <select class="form-control" th:field="*{items[__${istat.index}__].coa}" name="coa" th:disabled="${item.delInd == 'X'}">
                                                <option value="">--</option><option value="Y">Yes</option><option value="N">No</option>
                                            </select>
                                        </div>
                                        <div class="col-md-2">
                                            <label>Pass Through</label>
                                            <select class="form-control" th:field="*{items[__${istat.index}__].passThrough}" name="passThrough" th:disabled="${item.delInd == 'X'}">
                                                <option value="">--</option><option value="YES">Yes</option><option value="No">No</option>
                                            </select>
                                        </div>
                                        <div class="col-md-1">
                                            <label>MSDS</label>
                                            <select class="form-control" th:field="*{items[__${istat.index}__].msds}" name="msds" th:disabled="${item.delInd == 'X'}">
                                                <option value="">--</option><option value="Y">Yes</option><option value="N">No</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4 agreements-container" th:style="${prHeader.docType == 'ZOSO' ? 'display: block;' : 'display: none;'}">
                                            <label>AGREEMENTS</label>
                                            <select name="agreement" class="form-control agreements-dd" th:field="*{items[__${istat.index}__].agreement}" >
                                                <option value="">-- Select Agreements --</option>
                                            </select>

                                        </div>
                                        <div class="col-md-2 item-container" th:style="${prHeader.docType == 'ZOSO' ? 'display: block;' : 'display: none;'}">
                                            <label>ITEM</label>
                                            <input type="text" class="form-control"  th:field="*{items[__${istat.index}__].aggrItem}"  name="agreementItem" disabled style="background-color: #e9ecef;">
                                        </div>
                                        <div class="col-md-2 vendor-container" th:style="${prHeader.docType == 'ZOSO' ? 'display: block;' : 'display: none;'}">
                                            <label>FIXED VENDOR</label>
                                            <input type="text" class="form-control"  th:field="*{items[__${istat.index}__].fixVendor}"  name="fixedVendor" disabled style="background-color: #e9ecef;">
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </th:block>

                        </tbody>
                    </table>
                </div>
            </div>

            <div class="bottom-actions">
                <button class="btn-create" type="button" onclick="updatePR()">
                    <i class="bi bi-save me-1"></i> UPDATE PR
                </button>
            </div>

        </form> <!-- end of prForm -->
    </div>
</div>
</div>
</div>

<!-- scripts -->

<div layout:fragment="scriptContent">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:inline="javascript">
        // Define toggle functions at the top so they're available before DOMContentLoaded
        window.toggleAgreementsField = function() {
            const docType = document.getElementById("docType").value;
            const agreementsContainers = document.querySelectorAll(".agreements-container");
            const itemContainers = document.querySelectorAll(".item-container");
            const vendorContainers = document.querySelectorAll(".vendor-container");
            const reasonContainers = document.querySelectorAll(".reason-container");

            if (docType === 'ZOSO') {
                agreementsContainers.forEach(div => div.style.display = "block");
                itemContainers.forEach(div => div.style.display = "block");
                vendorContainers.forEach(div => div.style.display = "block");
            } else {
                agreementsContainers.forEach(div => div.style.display = "none");
                itemContainers.forEach(div => div.style.display = "none");
                vendorContainers.forEach(div => div.style.display = "none");
            }

            if (docType === 'ZCSP') {
                reasonContainers.forEach(div => div.style.display = "block");
            } else {
                reasonContainers.forEach(div => div.style.display = "none");
            }
        };

        window.toggleWbsInternalOrder = function() {
            const accAsmt = document.getElementById("accAsmt").value;
            const wbsContainers = document.querySelectorAll(".wbs-container");
            const internalOrderContainers = document.querySelectorAll(".internalOrder-container");
            const networkContainers = document.querySelectorAll(".network-container");
            const costCenterContainers = document.querySelectorAll(".costCenter-container");

            if (accAsmt === 'F') {
                wbsContainers.forEach(div => div.style.display = "none");
                internalOrderContainers.forEach(div => div.style.display = "block");
                networkContainers.forEach(div => div.style.display = "none");
                costCenterContainers.forEach(div => div.style.display = "none");
            }
            else if (accAsmt === 'N'){
                wbsContainers.forEach(div => div.style.display = "none");
                internalOrderContainers.forEach(div => div.style.display = "none");
                networkContainers.forEach(div => div.style.display = "block");
                costCenterContainers.forEach(div => div.style.display = "none");
            }
            else if (accAsmt === 'K'){
                wbsContainers.forEach(div => div.style.display = "none");
                internalOrderContainers.forEach(div => div.style.display = "none");
                networkContainers.forEach(div => div.style.display = "none");
                costCenterContainers.forEach(div => div.style.display = "block");
            }
            else {
                wbsContainers.forEach(div => div.style.display = "block");
                internalOrderContainers.forEach(div => div.style.display = "none");
                networkContainers.forEach(div => div.style.display = "none");
                costCenterContainers.forEach(div => div.style.display = "none");
            }
        };

        document.addEventListener("DOMContentLoaded", function () {
            // Initialize all sub-rows to be hidden and buttons to show + icon
            document.querySelectorAll('.sub-row').forEach(subRow => {
                subRow.style.display = 'none';

                // Ensure the toggle button has the correct icon
                const mainRow = subRow.previousElementSibling;
                if (mainRow) {
                    const btn = mainRow.querySelector('.btn-addinfo');
                    const icon = btn?.querySelector('i');
                    if (icon) {
                        icon.classList.remove('bi-dash-circle');
                        icon.classList.add('bi-plus-circle');
                    }
                    if (btn) {
                        btn.title = 'Add Info';
                    }
                }
            });

            // Loop through each item row and load WBS for it
            document.querySelectorAll('#itemTable tbody tr').forEach(row => {
                const plant = document.querySelector('#plant')?.value || ''; // header-level plant
                const selectedWbs = row.querySelector('.wbsElement-dd')?.getAttribute('th:value') || '';

                // Save selected WBS for reference
                if (selectedWbs) {
                    row.setAttribute('data-selected-wbs', selectedWbs);
                }

                if (plant) {
                 //   loadWBSElements(row, plant);
                }
            });
            document.querySelectorAll('#itemTable tbody tr:not(.sub-row)').forEach(row => {
        const qtyField = row.querySelector('[name*="quantity"]');
        const priceField = row.querySelector('[name*="valPrice"]');
        const totalField = row.querySelector('[name*="total"]');

        const qty = parseFloat(qtyField?.value || 0);
        const price = parseFloat(priceField?.value || 0);
        const total = qty * price;

        if (totalField) totalField.value = total.toFixed(2);
      });
        });
            let rowCount = 0;
            let materialList = [];

        // Make toggleSubRow globally accessible for inline onclick handlers
        window.toggleSubRow = function(btn) {
            const mainRow = btn.closest("tr");
            const subRow = mainRow.nextElementSibling;
            const icon = btn.querySelector("i");

            // Safety check: ensure subRow exists and has sub-row class
            if (!subRow || !subRow.classList.contains("sub-row")) {
                console.error("No sub-row found for this main row");
                return;
            }

            // Check current state of THIS sub-row
            const isCurrentlyHidden = subRow.style.display === "none" || subRow.style.display === "";

            // Close all other sub-rows first
            document.querySelectorAll(".sub-row").forEach(otherRow => {
                if (otherRow !== subRow && otherRow.style.display === "table-row") {
                    otherRow.style.display = "none";

                    // Reset the icon of the other row's button
                    const otherMainRow = otherRow.previousElementSibling;
                    if (otherMainRow) {
                        const otherBtn = otherMainRow.querySelector(".btn-addinfo");
                        const otherIcon = otherBtn?.querySelector("i");
                        if (otherIcon) {
                            otherIcon.classList.remove("bi-dash-circle");
                            otherIcon.classList.add("bi-plus-circle");
                        }
                        if (otherBtn) {
                            otherBtn.title = "Add Info";
                        }
                    }
                }
            });

            // Toggle the current sub-row
            if (isCurrentlyHidden) {
                // Opening the sub-row
                subRow.style.display = "table-row";
                icon.classList.remove("bi-plus-circle");
                icon.classList.add("bi-dash-circle");
                btn.title = "Hide Info";

                // Preserve CAS No from hidden field
                const casNoHidden = mainRow.querySelector('[name="casNoHid"]')?.value;
                const casInput = subRow.querySelector('[name="cas"]');
                if (casInput && casNoHidden) {
                    casInput.value = casNoHidden;
                }

                // Set Pass Through as required when opened
                const passThrough = subRow.querySelector('[name="passThrough"]');
                if (passThrough) {
                    passThrough.setAttribute('required', 'required');
                }

                console.log("✅ Sub-row opened");
            } else {
                // Closing the sub-row
                subRow.style.display = "none";
                icon.classList.remove("bi-dash-circle");
                icon.classList.add("bi-plus-circle");
                btn.title = "Add Info";

                console.log("✅ Sub-row closed");
            }
        }

    // Make updatePR globally accessible
    window.updatePR = async function() {
      const plant = document.getElementById("plant").value;
      const purGrp = document.getElementById("purGrp").value;
      const accAsmt = document.getElementById("accAsmt").value;
      const itemCat = document.getElementById("itemCat").value;
      const division = document.getElementById("division").value;
      const department = document.getElementById("department").value;
      const docType = document.getElementById("docType").value;
      const reqNumber = document.querySelector('[name*="reqNumber"]')?.value || "";

      // 🔹 Basic header validation
      if (!plant || !purGrp || !division || !department) {
        Swal.fire({
          icon: "warning",
          title: "Validation Error",
          text: "Please select Plant, Purchase Group, Division, and Department."
        });
        return;
      }
      if (!docType) {
        Swal.fire({
          icon: "warning",
          title: "Validation Error",
          text: "Please select a Document Type before updating PR!"
        });
        return;
      }

      // 🔹 Validate item rows
      const rows = Array.from(document.querySelectorAll("#itemTable tbody tr:not(.sub-row)"));
      const errors = [];

      rows.forEach((row, index) => {
        const rowNum = index + 1;
        const subRow = row.nextElementSibling?.classList.contains("sub-row") ? row.nextElementSibling : null;

        const status = row.querySelector('[name*="status"]')?.value || "A";
        const passThrough = subRow?.querySelector('[name*="passThrough"]')?.value?.trim();
        const wbs = subRow?.querySelector('[name*="wbsElement"]')?.value?.trim();
        const qty = row.querySelector('[name*="quantity"]')?.value?.trim();
        const reason = subRow?.querySelector('[name="reason"]')?.value?.trim();

        // ✅ Validate only if not deleted
        if (status !== "D") {
          if (!passThrough) errors.push(`Row ${rowNum}: Pass Through is required`);
          if (accAsmt === "P" && !wbs) errors.push(`Row ${rowNum}: WBS Element is required`);
          if (!qty || Number(qty) <= 0) errors.push(`Row ${rowNum}: Quantity must be greater than 0`);

          // ✅ Validate reason for ZCSP docType
          if (docType === 'ZCSP' && !reason) {
            errors.push(`Row ${rowNum}: Reason is mandatory for Document Type ZCSP`);
          }
        }
      });

      if (errors.length > 0) {
        Swal.fire({
          icon: "warning",
          title: "Validation Errors",
          html: errors.join("<br>")
        });
        return;
      }

      // 🔹 Build items array
      const items = rows.map((row, index) => {
        const subRow = row.nextElementSibling?.classList.contains("sub-row") ? row.nextElementSibling : null;

        return {
          matNumber: row.querySelector('[name*="matNumber"]')?.value || "",
          shortText: row.querySelector('[name*="shortText"]')?.value || "",
          uom: row.querySelector('[name*="uom"]')?.value || "",
          purGrp: purGrp,
          plant: plant,
          accAsmt: accAsmt,
          cas: subRow?.querySelector('[name*="cas"]')?.value || "",
          quantity: row.querySelector('[name*="quantity"]')?.value || "",
          valPrice: row.querySelector('[name*="valPrice"]')?.value || "",
          total: row.querySelector('[name*="total"]')?.value || "",
          materialGroup: row.querySelector('[name*="materialGroup"]')?.value || "",
          wbsElement: subRow?.querySelector('[name*="wbsElement"]')?.value || "",
          deliveryDate: row.querySelector('[name*="deliveryDate"]')?.value || "",
          storageLoc: row.querySelector('[name*="storageLoc"]')?.value || "",
          trackNo: row.querySelector('[name*="trackNo"]')?.value || "",
          division: subRow?.querySelector('[name*="diviItem"]')?.value || "",
          department: subRow?.querySelector('[name*="departItem"]')?.value || "",
          packSize: subRow?.querySelector('[name*="packSize"]')?.value || "",
          coa: subRow?.querySelector('[name*="coa"]')?.value || "",
          passThrough: subRow?.querySelector('[name*="passThrough"]')?.value || "",
          msds: subRow?.querySelector('[name*="msds"]')?.value || "",
          reason: subRow?.querySelector('[name="reason"]')?.value || "",
          agreement: subRow?.querySelector('[name="agreement"]')?.value || "",
          agreementItem: subRow?.querySelector('[name="agreementItem"]')?.value || "",
          fixedVendor: subRow?.querySelector('[name="fixedVendor"]')?.value || "",
          status: row.querySelector('[name*="status"]')?.value || "A"
        };
      });

      const payload = {
        reqNumber,
        docType,
        plant,
        purGrp,
        accAsmt,
        itemCat,
        division,
        department,
        items
      };

      console.log("📦 Submitting PR payload:", payload);

      // 🔹 Submit to backend
      try {
        const response = await fetch('/prCreate/update', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            [document.querySelector('meta[name="_csrf_header"]').content]:
              document.querySelector('meta[name="_csrf"]').content
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.status === 'success') {
          Swal.fire({
            title: 'PR Updated Successfully!',
            html: `<b>SAP PR Number:</b> ${data.sapPrNumber || 'N/A'}<br>${data.message}`,
            icon: 'success',
            confirmButtonText: 'Go to PR List',
            confirmButtonColor: '#3085d6'
          }).then(() => window.location.href = '/prCreate/list');
        } else {
          Swal.fire({
            title: 'Error!',
            text: data.message || 'Unexpected response from server.',
            icon: 'error',
            confirmButtonText: 'OK',
            confirmButtonColor: '#d33'
          });
        }

      } catch (err) {
        console.error("❌ Error submitting PR:", err);
        Swal.fire({
          title: 'Submission Failed',
          text: 'Unexpected error occurred. Please check logs.',
          icon: 'error',
          confirmButtonText: 'OK',
          confirmButtonColor: '#d33'
        });
      }
    }
