<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="layout">
<head>
    <meta charset="UTF-8">
    <title>PR List</title>


    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Bootstrap -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/4.6.0/css/bootstrap.min.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- DataTables -->
    <link rel="stylesheet" th:href="@{/webjars/datatables/1.13.6/css/jquery.dataTables.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/datatables-buttons/2.4.2/css/buttons.dataTables.min.css}"/>
    <!-- Scripts -->
    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/4.6.0/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/webjars/datatables/1.13.6/js/jquery.dataTables.min.js}"></script>
    <script th:src="@{/webjars/datatables-buttons/2.4.2/js/dataTables.buttons.min.js}"></script>
    <script th:src="@{/webjars/jszip/3.10.1/jszip.min.js}"></script>
    <script th:src="@{/webjars/datatables-buttons/2.4.2/js/buttons.html5.min.js}"></script>
    <script th:src="@{/webjars/fontawesome/5.15.4/js/all.min.js}"></script>

    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <style>
        .content-wrapper { padding: 2px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { margin: 10px auto; padding: 20px; width: 100%; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }

        /* Header */
        h1 {
          color: #033882;
          font-weight: 700;
        }

       /* Filter Panel - reduced height */
.form-horizontal {
  background: #DC402B;
  border-radius: 8px;
  padding: 8px 15px;
  color: white;
  margin-bottom: 15px;
}
.form-horizontal label {
  font-weight: 500;
  color: #fff;
  margin-bottom: 3px;
}
.form-horizontal .btn-primary {
  background-color: #033882;
  border: none;
  transition: 0.3s;
  padding: 5px 15px;
}
.form-horizontal .btn-primary:hover {
  background-color: #022b65;
}

/* Table Styling */
.table {
  border-collapse: separate !important;
  border-spacing: 0;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
}
.table thead {
  background-color: #033882 !important;
  color: white;
  text-align: center;
}
.table-hover tbody tr:hover {
  background-color: rgba(3, 56, 130, 0.08);
}
.table td{
  vertical-align: middle !important;
  text-align: center;
}
.table th {
  vertical-align: middle !important;
  text-align: center;
   background-color: #033882 !important;
}

/* Align search & buttons in same line */
div.dataTables_wrapper div.dataTables_filter {
  float: left;
  text-align: left;
  margin-bottom: 8px;
}
div.dataTables_wrapper div.dt-buttons {
  float: right;
  text-align: right;
  margin-bottom: 8px;
}

/* Excel button styling */
.dt-button.buttons-excel {
  background-color: #033882 !important;
  color: #fff !important;
  border: none !important;
  border-radius: 5px !important;
  padding: 6px 12px !important;
  font-size: 13px !important;
}
.dt-button.buttons-excel:hover {
  background-color: #022b65 !important;
}

/* Child table rows */
table.dataTable tr.child td {
  background-color: #f9f9f9;
}

    </style>
</head>


<body>
<section layout:fragment="header">
    <div class="container">
        <div class="row mb-2">
            <div class="col-sm-6"><h1>Purchase Requisition List</h1></div>
        </div>
    </div>
</section>

<div class="container" layout:fragment="content">
    <div class="card">

        <form th:action="@{/prCreate/list/filter}" method="get" class="form-horizontal mb-3 row">
            <div class="form-group col-md-3">
                <label for="fromDate" class="control-label">From Date</label>
                <input type="date" id="fromDate" name="fromDate" class="form-control"
                       th:value="${#dates.format(fromDate, 'yyyy-MM-dd')}">
            </div>
            <div class="form-group col-md-3">
                <label for="toDate" class="control-label">To Date</label>
                <input type="date" id="toDate" name="toDate" class="form-control"
                       th:value="${#dates.format(toDate, 'yyyy-MM-dd')}">
            </div>
            <div class="form-group col-md-3">
                <label for="docType" class="control-label" style="color: white;">Document Type</label>
                <select id="docType" name="docType" class="form-control searchable-dropdown" style="width:100%;">
                    <option value="">-- All Document Types --</option>
                    <option th:each="dt : ${docTypes}"
                            th:value="${dt.emdValue1}"
                            th:selected="${selectedDocType == dt.emdValue1}"
                            th:text="${dt.emdValue2 + ' (' + dt.emdValue1 + ')'}">
                    </option>
                </select>
            </div>
            <div class="form-group col-md-3 align-self-end">
                <button type="submit" class="btn btn-primary">Filter</button>
            </div>
        </form>

        <!-- PR Table -->
        <table id="prTable" class="table table-bordered table-striped table-hover w-100">
            <thead>
            <tr>
                <th></th>
                <th>PR Number</th>
                <th>Document Type</th>
                <th>Division</th>
                <th>Plant</th>
                <th>Created By</th>
                <th>Status</th>
                <th>Reminder</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="header : ${headers}">
                <td class="details-control"><i class="fas fa-caret-right"></i></td>
                <td>
                    <span th:if="${header.status == 'RELEASED'}"
                          th:text="${header.reqNumber}"></span>
                    <!--  <a  th:if="${header.status != 'RELEASED'}" th:href="@{'/prCreate/edit/' + ${header.reqNumber}}"
                         th:text="${header.reqNumber}"
                         class="text-primary fw-bold text-decoration-none">
                      </a>-->

                    <form th:if="${!#strings.equalsIgnoreCase(header.status, 'RELEASED') and (header.itemCat != 'D' and  header.itemCat != '9') }"
                          th:action="@{/prCreate/edit}" method="post" style="display:inline;">
                        <input type="hidden" name="reqNumber" th:value="${header.reqNumber}" />
                        <button type="submit"
                                class="text-primary fw-bold text-decoration-none"
                                style="border:none;background:none;padding:0;cursor:pointer;">
                            <span th:text="${header.reqNumber}"></span>
                        </button>
                    </form>
                    <!-- Service PR Edit (Item Category = D) -->
                    <form th:if="${!#strings.equalsIgnoreCase(header.status, 'RELEASED')
              and (header.itemCat == 'D' or header.itemCat == '9')}"
                          th:action="@{/prServiceLine/edit}"
                          method="post"
                          style="display:inline;">

                        <input type="hidden" name="reqNumber" th:value="${header.reqNumber}" />

                        <button type="submit"
                                class="text-primary fw-bold text-decoration-none"
                                style="border:none;background:none;padding:0;cursor:pointer;">
                            <span th:text="${header.reqNumber}"></span>
                            <i class="bi bi-gear-fill ms-1"
                               style="font-size:0.8rem;"
                               title="Edit Service PR"></i>
                        </button>
                    </form>

                    <span th:if="${#strings.equalsIgnoreCase(header.status, 'RELEASED')
              and (header.itemCat == 'D' or header.itemCat == '9')}">


    <i class="bi bi-gear-fill ms-1 text-muted"
       style="font-size:0.8rem; cursor:not-allowed;"
       title="PR is already released"></i>
</span>



                </td>
                <td th:text="${header.docType}"></td>
                <td th:text="${header.division}"></td>
                <td th:text="${header.plant}"></td>
                <td th:text="${header.createdBy}"></td>
                <td th:text="${header.status}"></td>
                <td>
                    <button type="button" class="btn btn-outline-primary"
                            th:attr="data-reqNumber=${header.reqNumber}"
                            onclick="sendPRReminder(this)"
                            title="Send Reminder Mail">
                        <i class="bi bi-bell"></i>
                    </button>
                </td>

                <!-- Hidden child row data (JSON-like for DataTables) -->
                <td hidden>
                    <table class="table table-sm table-bordered mb-2">
                        <thead class="bg-light">
                        <tr>
                            <th>#</th>
                            <th>Item No</th>
                            <th>Material Code</th>
                            <th>Description</th>
                            <th>Plant</th>
                            <th>Storage Loc</th>
                            <th>Quantity</th>
                            <th>UOM</th>
                            <th>WBS Element</th>
                            <th>CAS No</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item, istat : ${header.items}">
                            <td th:text="${istat.index + 1}"></td>
                            <td th:text="${item.itemNO}"></td>
                            <td th:text="${item.matNumber}"></td>
                            <td th:text="${item.shortText}"></td>
                            <td th:text="${item.plant}"></td>
                            <td th:text="${item.storageLoc}"></td>
                            <td th:text="${item.quantity}"></td>
                            <td th:text="${item.uom}"></td>
                            <td th:text="${item.wbsElement}"></td>
                            <td th:text="${item.cas}"></td>
                        </tr>
                        </tbody>
                    </table>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div layout:fragment="scriptContent">


    <script th:inline="javascript">
        $(document).ready(function () {
          // Initialize Select2 for any searchable dropdowns (the select has no options initially)
          if (typeof $().select2 === 'function') {
              $('.searchable-dropdown').select2({
                  placeholder: "-- Select Document Type --",
                  allowClear: true,
                  width: 'resolve'
              });
          }

          // 1?? Move hidden child <td> content into a data attribute
          $('#prTable tbody tr').each(function () {
              const $tr = $(this);
              const $hiddenTd = $tr.find('td[hidden]');
              if ($hiddenTd.length) {
                  $tr.data('childHtml', $hiddenTd.html());
                  $hiddenTd.remove();
              }
          });

          // 2?? Initialize DataTable with fixed layout
          const table = $('#prTable').DataTable({
              dom: '<"row mb-2"<"col-md-6"f><"col-md-6 text-right"B>>rt<"row"<"col-md-6"l><"col-md-6"p>>',
              pageLength: 10,
              order: [],
              buttons: [
                  {
                      extend: 'excelHtml5',
                      text: 'Download Excel',
                      exportOptions: {
                          columns: ':visible:not(:first-child)' // exclude caret column
                      },
                      customizeData: function (data) {
                          // Clear old body and rebuild properly
                          const newBody = [];

                          // Loop through each PR row
                          $('#prTable tbody tr').each(function () {
                              const $tr = $(this);
                              const mainRow = $tr.children('td').map(function (i, td) {
                                  if (i > 0) return $(td).text().trim();
                              }).get();

                              newBody.push(mainRow); // main PR row

                              // Add its item rows under it
                              const childHtml = $tr.data('childHtml');
                              if (childHtml) {
                                  const itemRows = $(childHtml).find('tbody tr');
                                  itemRows.each(function () {
                                      const itemCells = $(this).find('td').map(function () {
                                          return $(this).text().trim();
                                      }).get();
                                      newBody.push(['', '? Item', ...itemCells]);
                                  });
                              }
                          });

                          data.body = newBody;
                      }
                  }
              ],
              columnDefs: [{ orderable: false, targets: 0 }],
              language: {
                  search: "_INPUT_",
                  searchPlaceholder: "Search PRs...",
                  lengthMenu: "Show _MENU_ entries per page"
              }
          });

          // 3?? Toggle expand/collapse for PR items
          $('#prTable tbody').on('click', 'td.details-control', function () {
              const $td = $(this);
              const tr = $td.closest('tr');
              const row = table.row(tr);

              if (row.child.isShown()) {
                  row.child.hide();
                  tr.removeClass('shown');
                  $td.find('i').removeClass('fa-caret-down').addClass('fa-caret-right');
              } else {
                  const childHtml = tr.data('childHtml') || '<div class="p-2">No items</div>';
                  row.child(childHtml).show();
                  tr.addClass('shown');
                  $td.find('i').removeClass('fa-caret-right').addClass('fa-caret-down');
              }
          });

        });


        // Mail service

function sendPRReminder(button) {
    const reqNumber = button.getAttribute('data-reqNumber');
    console.log("Reminder triggered for PR:", reqNumber);

    fetch(`/prCreate/sendReminder/${reqNumber}`, { method: 'POST' })
        .then(response => {
            if (response.ok) {
                alert("Reminder mail sent successfully!");
            } else {
                alert("Reminder mail sent successfully!");
            }
        })
        .catch(error => {
            console.error("Error:", error);
            alert("An error occurred while sending the reminder.");
        });
}
    </script>
</div>

</body>
</html>
