        let serviceCodeList = [];


	let INTERNAL_ORDER_CACHE = null;
	let INTERNAL_ORDER_LOADING = false;

	function loadInternalOrdersOnce() {
	  if (INTERNAL_ORDER_CACHE) {
	    return Promise.resolve(INTERNAL_ORDER_CACHE);
	  }

	  if (INTERNAL_ORDER_LOADING) {
	    return new Promise(resolve => {
	      const check = setInterval(() => {
	        if (INTERNAL_ORDER_CACHE) {
	          clearInterval(check);
	          resolve(INTERNAL_ORDER_CACHE);
	        }
	      }, 100);
	    });
	  }

	  INTERNAL_ORDER_LOADING = true;

	  return fetch('/getInternalOrders')
	    .then(res => res.json())
	    .then(data => {
	      INTERNAL_ORDER_CACHE = data || [];
	      INTERNAL_ORDER_LOADING = false;
	      return INTERNAL_ORDER_CACHE;
	    })
	    .catch(err => {
	      INTERNAL_ORDER_LOADING = false;
	      console.error("❌ Failed to load Internal Orders", err);
	      return [];
	    });
	}



    let currentShortTextInput = null;
function openOnlyThisSubRow(mainRow, subRow) {
  // Close all other sub-rows and reset their buttons
  document.querySelectorAll(".sub-row").forEach(row => {
    if (row !== subRow) {
      row.style.display = "none";
      const otherBtn = row.previousElementSibling?.querySelector(".btn-addinfo i");
      if (otherBtn) {
        otherBtn.classList.remove("bi-dash-circle");
        otherBtn.classList.add("bi-plus-circle");
        const parentBtn = row.previousElementSibling?.querySelector(".btn-addinfo");
        if (parentBtn) parentBtn.title = "Add Info";
      }
    }
  });

  // Open the new subRow and set its main row button to "Hide Info"
  subRow.style.display = "table-row";
  const icon = mainRow.querySelector(".btn-addinfo i");
  const parentBtn = mainRow.querySelector(".btn-addinfo");
  if (icon) {
    icon.classList.remove("bi-plus-circle");
    icon.classList.add("bi-dash-circle");
  }
  if (parentBtn) parentBtn.title = "Hide Info";
}

    row.find('[name*="serviceDesc"]').val(service.servCodeDesc);
  } else {
    row.find('[name*="serviceDesc"]').val('');

// Function to enable/disable fields based on service code or short text
function toggleServiceRowFields($row) {
  const serviceCodeVal = $row.find('.service-code').val();
  const shortTextVal = $row.find('.short-text-input').val();

  // Enable fields only if either service code OR short text has a value
  const shouldEnable = (serviceCodeVal && serviceCodeVal.trim() !== '') || (shortTextVal && shortTextVal.trim() !== '');

  console.log("?? toggleServiceRowFields() called");
  console.log("   - Service Code:", serviceCodeVal);
  console.log("   - Short Text:", shortTextVal);
  console.log("   - Should Enable:", shouldEnable);

  // Toggle quantity, unit price, UOM fields
  $row.find('[name*="serviceQty"]').prop('disabled', !shouldEnable);
  $row.find('[name*="servicePrice"]').prop('disabled', !shouldEnable);
  $row.find('[name*="serviceUOM"]').prop('disabled', !shouldEnable);

  // Toggle WBS, Internal Order, Cost Center, and Network fields
  $row.find('.service-wbs').prop('disabled', !shouldEnable);
  $row.find('.service-internalOrder').prop('disabled', !shouldEnable);
  $row.find('.service-costCenter').prop('disabled', !shouldEnable);
  $row.find('.service-network').prop('disabled', !shouldEnable);

  // If enabling, also trigger Select2 initialization if needed
  if (shouldEnable) {
    console.log("   ? Enabling dropdowns");
  } else {
    console.log("   ?? Disabling dropdowns");
  }
}

function loadNetwork(row, plant)
{
    const dropdowns = row.querySelectorAll('.service-network');
    dropdowns.forEach(dropdown => {
        dropdown.innerHTML = `<option>Loading...</option>`;
    });

    if (!plant) {
        dropdowns.forEach(dropdown => {
            dropdown.innerHTML = `<option value="">-- Select Network --</option>`;
        });
        return;
    }

    fetch(`/getNetwork?plant=${plant}`)
          .then(async res => {
            if (!res.ok) throw new Error("Network error while fetching networks.");
              const text = await res.text();
    if (!text.trim()) return []; // return empty array safely
            try {
      return JSON.parse(text);
    } catch (err) {
      console.error("? Invalid JSON from backend:", text);
      throw new Error("Invalid JSON response from backend.");
    }
        })
        .then(data => {
            if (!Array.isArray(data) || data.length === 0) {
                dropdowns.forEach(dropdown => {
                    dropdown.innerHTML = `<option value="">-- No Networks Found --</option>`;
                });
                return;
            }

            dropdowns.forEach(dropdown => {
                dropdown.innerHTML = `<option value="">-- Select Network --</option>`;
                data.forEach(net => {
                    const opt = document.createElement('option');
                    opt.value = net.emdValue1.split("#")[0];
                    opt.textContent = `${net.emdValue2} (${net.emdValue1.split("#")[0]})`;
                    dropdown.appendChild(opt);
                });
            });
        })
        .catch(err => {
            console.error("? Error loading networks:", err);
            dropdowns.forEach(dropdown => {
                dropdown.innerHTML = `<option value="">-- Error loading Networks --</option>`;
            });
        });
}

function loadServiceCode(mainRow, matGroup) {
  const plant = document.getElementById("plant")?.value;
  if (!plant || !matGroup) {
    console.warn("Missing plant or material group for service code load.");
    return;
  }

  const subRow = mainRow.nextElementSibling;
  if (!subRow) return;

  const serviceDropdowns = subRow.querySelectorAll(".service-code");

  // Reset before loading
  serviceDropdowns.forEach(sel => {
    sel.innerHTML = '<option value="">-- Loading Service Codes --</option>';
  });

  fetch(`/getServiceCode?plant=${plant}&matGroup=${matGroup}`)
    .then(res => {
      if (!res.ok) throw new Error("Error fetching service codes");
      return res.json();
    })
    .then(data => {
      if (!Array.isArray(data) || data.length === 0) {
        serviceDropdowns.forEach(sel => {
          sel.innerHTML = '<option value="">-- No Service Codes Found --</option>';
        });
        return;
      }

      // Populate all service dropdowns for that item
      serviceDropdowns.forEach(sel => {
        sel.innerHTML = '<option value="">-- Select Service Code --</option>';
        data.forEach(srv => {
          const fullCode = srv.emdValue1.split("#")[0]; // full 18-digit
          const trimmedCode = fullCode.replace(/^0+/, ''); // remove leading zeros for display only
          const uom = srv.emdValue4 || '';
          const opt = document.createElement("option");
          opt.value = fullCode + "#" + uom;
          opt.textContent = `${srv.emdValue2} (${trimmedCode}))`;
          sel.appendChild(opt);
        });
      });

      console.log(`? Loaded ${data.length} service codes for MatGroup: ${matGroup}`);
    })
    .catch(err => {
      console.error("? Error loading service codes:", err);
      serviceDropdowns.forEach(sel => {
        sel.innerHTML = '<option value="">-- Error Loading Service Codes --</option>';
      });
    });
}

async function submitPR() {

        });
        return;
    }

    if (!docType) {
        Swal.fire({
            icon: "warning",
            title: "Validation Error",
            text: "Please select a Document Type before creating PR!"
        });
        return;
    }

    // ?? Check Release Strategy
    try {
        const res = await fetch(`/checkReleaseStrategy?plant=${plant}&purGrp=${purGrp}&division=${division}&department=${department}`);
        const isMaintained = await res.json();
        if (!isMaintained) {
            Swal.fire({
                icon: "warning",
                title: "Release Strategy Missing",
                text: "Release Strategy not maintained for this Plant, Purchase Group, Division, or Department!"
            });
            return;
        }
    } catch (err) {
        console.error("Error checking release strategy:", err);
        Swal.fire({ icon: "error", title: "Error", text: "Error checking release strategy. Please try again." });
        return;
    }

    // ?? Validate & Prepare Items

    const itemRows = Array.from(document.querySelectorAll("#itemTable > tbody > tr")).filter(tr => !tr.classList.contains("sub-row"));
    const items = [];
    const errors = [];

    itemRows.forEach((itemRow, index) => {
        const rowNum = index + 1;
        const subRow = itemRow.nextElementSibling;
        let wbsForItem;
        let internalOr;
        let costCent;
        let netwk;
        if (!subRow || !subRow.classList.contains("sub-row")) {
            errors.push(`Row ${rowNum}: Missing sub-row (service section).`);
            return;
        }

        // ?? Main row values
        const quantity= parseFloat(itemRow.querySelector('[name="quantity"]')?.value || "0");
        const valPrice = parseFloat(itemRow.querySelector('[name="price"]')?.value || "0");
        const total = parseFloat(itemRow.querySelector('[name="total"]')?.value || "0");
        const shortText = itemRow.querySelector('[name="Description"]')?.value?.trim() || "";
        const deliveryDate = itemRow.querySelector('[name="deliveryDate"]')?.value || "";

        const trackNo = itemRow.querySelector('[name="TrackNo"]')?.value?.trim() || "";
        const currency = itemRow.querySelector('[name="currency"]')?.value?.trim() || "";

        // ?? Validate item values
        if (!valPrice || valPrice <= 0) errors.push(`Row ${rowNum}: Gross Price is required and must be greater than 0`);
        if (!total || total <= 0) errors.push(`Row ${rowNum}: Total Value is required and must be greater than 0`);

        // ?? Sub-row fields
        const passThrough = subRow.querySelector('[name="passThrough"]')?.value?.trim() || "";
        const division = subRow.querySelector('[name="diviItem"]')?.value?.trim() || "";
        const department = subRow.querySelector('[name="departItem"]')?.value?.trim() || "";

        if (!passThrough) errors.push(`Row ${rowNum}: Pass Through is mandatory.`);

        // ?? Service table inside sub-row
        const serviceBody = subRow.querySelector(`[id^="serviceBody_"]`);
        const services = [];

        if (serviceBody) {
            const serviceRows = serviceBody.querySelectorAll("tr");
            serviceRows.forEach((srvRow, i) => {
                const servNoRaw = srvRow.querySelector('[name^="serviceName_"]')?.value || "";
                if (!servNoRaw) return; // skip empty service rows
                const servNo = servNoRaw.split("#")[0];
               // const servNo = servNoRaw.replace(/^0+/, ""); // remove leading zeros
                const servDesc = srvRow.querySelector('[name^="serviceDesc_"]')?.value?.trim() || "";
                const servQty = parseFloat(srvRow.querySelector('[name^="serviceQty_"]')?.value || "0");
                const servPrice = parseFloat(srvRow.querySelector('[name^="servicePrice_"]')?.value || "0");
                const servUnit = srvRow.querySelector('[name^="serviceUOM_"]')?.value?.trim() || "";
                const servWBS = srvRow.querySelector('[name^="serviceWBS_"]')?.value?.trim() || "";
                const servInternalOrder = srvRow.querySelector('[name^="serviceInternalOrder_"]')?.value?.trim() || "";
                const servCostCenter = srvRow.querySelector('[name^="serviceCostCenter_"]')?.value?.trim() || "";
                const servNetwork = srvRow.querySelector('[name^="serviceNetwork_"]')?.value?.trim() || "";
                const servNetPrice = (servQty * servPrice).toFixed(2);
                wbsForItem=servWBS;
                internalOr=servInternalOrder;
                costCent=servCostCenter;
                netwk=servNetwork;
                services.push({
                    servLine: (i + 1).toString(),
                    servNo,
                    servDesc,
                    servQty,
                    servUnit,
                    servPrice,
                    servNetPrice,
                    servWBS,
                    servInternalOrder,
                    servCostCenter,
                    servNetwork
                });
            });
        }
    const wbsElement=wbsForItem;
    const internalOrder=internalOr;
    const network=netwk;
    const costCenter=costCent;
        // ?? Combine item object
        items.push({
            itemNo: itemRow.querySelector("td:first-child")?.innerText.trim() || "",
            shortText,
            materialGroup,
            valPrice,
            total,
            deliveryDate,
            trackNo,
            currency,
            passThrough,
            division,
            department,
            wbsElement,
            network,
            costCenter,
            internalOrder,
            quantity,
            services
        });
    });

    // ?? Show validation errors if any
    if (errors.length > 0) {
        Swal.fire({
            icon: "warning",
            title: "Validation Errors",
            html: errors.join("<br>")
        });
        return;
    }

    // ?? Prepare final payload
    const payload = { docType, plant, purGrp, accAsmt, itemCateg, division, department, items };
    console.log("?? Final PR Payload:", payload);

    // ?? Submit to backend
    try {
        const response = await fetch('/prCreate/postServicePR', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                [document.querySelector('meta[name="_csrf_header"]').content]:
                    document.querySelector('meta[name="_csrf"]').content
            },
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.status === 'success') {
            Swal.fire({
                title: 'PR Created Successfully!',
                html: `<b>SAP PR Number:</b> ${data.sapPrNumber}<br>${data.message}`,
                icon: 'success',
                confirmButtonText: 'Go to PR List',
                confirmButtonColor: '#3085d6'
            }).then(() => window.location.href = '/prCreate/list');
        } else {
            Swal.fire({
                title: 'Error!',
                text: data.message,
                icon: 'error',
                confirmButtonText: 'OK',
                confirmButtonColor: '#d33'
            });
        }

    } catch (err) {
        console.error("Error submitting PR:", err);
        Swal.fire({
            title: 'Submission Failed',
            text: 'Unexpected error. Please check logs.',
            icon: 'error',
            confirmButtonText: 'OK',
            confirmButtonColor: '#d33'
        });
    }
}

function afterItemRowAdded(uniqueId) {
  const subRow = document.getElementById(`serviceBody_${uniqueId}`)?.closest('tr');
  if (subRow) {
   populateServiceDropdowns(subRow);
  }
}
function populateServiceDropdowns(subRow) {
  const plant = document.getElementById("plant")?.value;
  if (!plant) return;

  const mainRow = subRow.previousElementSibling;
  const matGroup = mainRow?.querySelector(".material-group-dd")?.value;

  // Load Service Codes for selected Material Group
  if (matGroup) {
    loadServiceCode(mainRow, matGroup);
  }

  // Load WBS & Network
  loadWBSElements(subRow, plant);
  loadNetwork(subRow, plant);
}
function openShortTextModal(button) {
  console.log("openShortTextModal called");

  // Navigate up to the parent div, then find the hidden input
  const container = button.closest('.d-flex');

  if (!container) {
    console.error("Could not find container div");
    alert("Error: Could not find container div. Please refresh the page.");
    return;
  }

  currentShortTextInput = container.querySelector('.short-text-input');

  if (!currentShortTextInput) {
    console.error("Short text input not found! Container HTML:", container.innerHTML);
    alert("Error: Short text input not found. Please refresh the page.");
    return;
  }

  // Populate modal with current value
  const modalInput = document.getElementById('shortTextModalInput');
  if (!modalInput) {
    console.error("Modal textarea #shortTextModalInput not found!");
    alert("Error: Modal input field not found. Please refresh the page.");
    return;
  }

  modalInput.value = currentShortTextInput.value || '';

  // Show the modal
  const modalEl = document.getElementById('shortTextModal');
  if (!modalEl) {
    console.error("Modal element #shortTextModal not found!");
    alert("Error: Modal element not found. Please refresh the page.");
    return;
  }

  try {
    // Use jQuery if available, otherwise use Bootstrap 5 constructor
    if (typeof $ !== 'undefined' && $.fn.modal) {
      $('#shortTextModal').modal('show');
      console.log("Modal opened successfully using jQuery");
    } else if (typeof bootstrap !== 'undefined') {
      let modalInstance = bootstrap.Modal.getInstance(modalEl);
      if (!modalInstance) {
        modalInstance = new bootstrap.Modal(modalEl);
      }
      modalInstance.show();
      console.log("Modal opened successfully using Bootstrap");
    } else {
      throw new Error("Bootstrap or jQuery not loaded");
    }
  } catch (error) {
    console.error("Error opening modal:", error);
    alert("Error opening modal: " + error.message);
  }
}




function updateMainRowTotals(serviceBodyId) {
  const serviceBody = document.getElementById(serviceBodyId);
  if (!serviceBody) return;

  const mainRow = serviceBody.closest('.sub-row').previousElementSibling;
  if (!mainRow) return;

  let totalGrossPrice = 0;
  let totalValue = 0;
  let totalQty = 0;

  // Loop through all service rows
  const serviceRows = serviceBody.querySelectorAll('tr');
  serviceRows.forEach(row => {
    const qty = parseFloat(row.querySelector('[name*="serviceQty"]')?.value) || 0;
    const price = parseFloat(row.querySelector('[name*="servicePrice"]')?.value) || 0;

    totalQty += qty;
    totalGrossPrice += price;
    totalValue += (qty * price);
  });

  // Update main row fields
  mainRow.querySelector('[name="quantity"]').value = totalQty.toFixed(2);
  mainRow.querySelector('[name="price"]').value = totalGrossPrice.toFixed(2);
  mainRow.querySelector('[name="total"]').value = totalValue.toFixed(2);
}

// Remove a service row and recalculate totals
function deleteServiceRow(btn) {
  const tr = btn.closest('tr');
  if (!tr) return;

  const tbody = tr.closest('tbody[id^="serviceBody_"]');
  tr.remove();

  if (tbody && tbody.id) {
    updateMainRowTotals(tbody.id);
  }
}

 function autoCloseSidebar() {
  const btn = document.querySelector('a.nav-link[data-widget="pushmenu"]');
  if (!btn) return;
  // Only click if sidebar is not already collapsed
  if (!document.body.classList.contains('sidebar-collapse')) {
    btn.click();
  }
}

$(document).on('focus', '.service-internalOrder', async function () {
  const $dropdown = $(this);

  // Prevent duplicate initialization
  if ($dropdown.data('select2')) return;

  const data = await loadInternalOrdersOnce();

  // Populate only once
  $dropdown.empty().append('<option value="">-- Select Internal Order --</option>');

  data.forEach(io => {
    $dropdown.append(
      `<option value="${io.emdValue1}">
        ${io.emdValue1} - ${io.emdValue2}
      </option>`
    );
  });

  $dropdown.select2({
    placeholder: "-- Type to search Internal Order --",
    allowClear: true,
    width: '100%',
    minimumInputLength: 0,
    matcher: function (params, data) {
      if ($.trim(params.term) === '') return data;
      return data.text.toLowerCase().includes(params.term.toLowerCase())
        ? data
        : null;
    }
  });
});

function initAutoClose() {
  if (document.readyState === 'complete') {
    autoCloseSidebar();
  } else {
    window.addEventListener('load', autoCloseSidebar, { once: true });
  }
}

document.addEventListener('DOMContentLoaded', initAutoClose, { once: true });
