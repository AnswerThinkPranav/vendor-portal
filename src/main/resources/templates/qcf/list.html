<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="layout">
<head>
    <meta charset="UTF-8">
    <title>QCF List</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <style>
        .vr-breadcrumb { font-size: 13px; color: #6c7a91; margin-bottom: 18px; letter-spacing: .2px; }
        .vr-breadcrumb .current { color: var(--blue-color); font-weight: 600; }

        .vr-card { background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(3, 56, 130, 0.08); overflow: hidden; width: 100%; margin: 0 0 24px 0; }
        .vr-card-header { background: linear-gradient(120deg, var(--blue-color) 0%, #0a4fae 100%); color: #fff; padding: 18px 28px; }
        .vr-card-header h4 { margin: 0; font-weight: 700; letter-spacing: .3px; }

        .vr-filter-bar {
            display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px;
            padding: 18px 28px; border-bottom: 1px solid #eef1f6; background: #fbfcfe;
        }
        .vr-filter-field { display: flex; flex-direction: column; gap: 4px; }
        .vr-filter-field label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: #7c879b; }
        .vr-filter-field .form-control { border-radius: 9px; border: 1px solid #dde3ec; height: 36px; font-size: 13.5px; box-shadow: none; }
        .vr-go-btn {
            background: linear-gradient(120deg, var(--blue-color), #0a4fae); border: none; border-radius: 9px;
            padding: 8px 20px; font-weight: 600; color: #fff; height: 36px; font-size: 13.5px;
        }
        .vr-go-btn:hover { color: #fff; transform: translateY(-1px); }

        .vr-table-wrap { padding: 6px 28px 10px 28px; overflow-x: auto; }
        table.vr-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
        table.vr-table thead th {
            background: #325786; color: #fff; font-weight: 700;
            font-size: 11.5px; letter-spacing: .3px; padding: 10px 12px; text-align: center; border-bottom: 2px solid #274263;
        }
        table.vr-table tbody td { padding: 9px 12px; text-align: center; }
        table.vr-table tbody tr td:first-child a { font-weight: 700; color: #1c2733; }
        .vr-legend { display: flex; flex-wrap: wrap; gap: 18px; padding: 4px 28px 22px 28px; font-size: 12.5px; color: #4b5876; }
        .vr-legend span { display: inline-flex; align-items: center; gap: 6px; }
        .vr-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <div class="vr-breadcrumb">RFQs &nbsp;/&nbsp; <span class="current">QCF List</span></div>

        <div class="vr-card">
            <div class="vr-card-header"><h4>QCF List</h4></div>

            <form class="vr-filter-bar" id="filterForm" onsubmit="return false;">
                <div class="vr-filter-field">
                    <label>Type</label>
                    <select class="form-control" id="f_rfqType">
                        <option value="DOM" th:selected="${rfqType == 'DOM'}">Domestic</option>
                        <option value="IMP" th:selected="${rfqType == 'IMP'}">Import</option>
                    </select>
                </div>
                <div class="vr-filter-field">
                    <label>Status</label>
                    <select class="form-control" id="f_type">
                        <option value="New" th:selected="${type == 'New'}">New</option>
                        <option value="Sub" th:selected="${type == 'Sub'}">Submitted</option>
                    </select>
                </div>
                <div class="vr-filter-field">
                    <button type="button" class="vr-go-btn" onclick="reloadTable()">Go <i class="fa fa-paper-plane"></i></button>
                </div>
            </form>

            <div class="vr-table-wrap">
                <table class="vr-table" id="qcfTable" style="width:100%">
                    <thead>
                    <tr>
                        <th>QCF No</th>
                        <th>Title</th>
                        <th>Plant</th>
                        <th>Created By</th>
                        <th>Created On</th>
                        <th>Expiry Date</th>
                        <th>No of Vendors (Qtn Sent)</th>
                        <th>No of Vendors (Offer Received)</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="vr-legend">
                <span><i style="background:#f2f540e0"></i>New</span>
                <span><i style="background:#2abb1894"></i>Submitted</span>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="scriptContent">
    <script th:src="@{/resources/lte3dot2/plugins/datatables/jquery.dataTables.min.js}"></script>
    <script th:src="@{/resources/lte3dot2/plugins/datatables-bs4/js/dataTables.bootstrap4.min.js}"></script>
    <script th:inline="javascript">
        var qcfTable = null;

        $(function () {
            qcfTable = $('#qcfTable').DataTable({
                serverSide: true,
                processing: true,
                pageLength: 10,
                order: [ [0, 'desc'] ],
                ajax: {
                    url: '/qcf/list/datatable',
                    data: function (d) {
                        d.type = $('#f_type').val();
                        d.rfqType = $('#f_rfqType').val();
                    }
                },
                columns: [
                    { data: 'qcfNo', render: function (qcfNo, type, row) {
                        return '<a href="/qcf/compare/' + qcfNo + '?type=' + $('#f_type').val() + '">' + qcfNo + '</a>';
                    } },
                    { data: 'qcfTitle' },
                    { data: 'plant' },
                    { data: 'createdBy' },
                    { data: 'createdOn' },
                    { data: 'expiryDate' },
                    { data: 'noOfVendorsSent' },
                    { data: 'noOfVendorsReceived' }
                ],
                rowCallback: function (row, data) {
                    $(row).css('background-color', data.statusColor || '');
                },
                language: { searchPlaceholder: 'Search...', search: '' }
            });
        });

        function reloadTable() {
            qcfTable.ajax.reload();
        }
    </script>
</div>
</body>
</html>
