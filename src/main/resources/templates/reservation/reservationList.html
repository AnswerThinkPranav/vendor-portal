<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="layout">
<head>
    <meta charset="UTF-8">
    <title>Reservation List</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Bootstrap -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/4.6.0/css/bootstrap.min.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- DataTables -->
    <link rel="stylesheet" th:href="@{/webjars/datatables/1.13.6/css/jquery.dataTables.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/datatables-buttons/2.4.2/css/buttons.dataTables.min.css}"/>
    <!-- Scripts -->
    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/4.6.0/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/webjars/datatables/1.13.6/js/jquery.dataTables.min.js}"></script>
    <script th:src="@{/webjars/datatables-buttons/2.4.2/js/dataTables.buttons.min.js}"></script>
    <script th:src="@{/webjars/jszip/3.10.1/jszip.min.js}"></script>
    <script th:src="@{/webjars/datatables-buttons/2.4.2/js/buttons.html5.min.js}"></script>
    <script th:src="@{/webjars/fontawesome/5.15.4/js/all.min.js}"></script>

    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <style>
        .content-wrapper { padding: 2px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { margin: 10px auto; padding: 20px; width: 100%; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }

        /* Header */
        h1 { color: #033882; font-weight: 700; }

        .form-horizontal { background: #DC402B; border-radius: 8px; padding: 8px 15px; color: white; margin-bottom: 15px; }
        .form-horizontal label { font-weight: 500; color: #fff; margin-bottom: 3px; }
        .form-horizontal .btn-primary { background-color: #033882; border: none; transition: 0.3s; padding: 5px 15px; }
        .form-horizontal .btn-primary:hover { background-color: #022b65; }

        /* Table Styling */
        .table { border-collapse: separate !important; border-spacing: 0; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08); }
        .table thead { background-color: #033882 !important; color: white; text-align: center; }
        .table-hover tbody tr:hover { background-color: rgba(3, 56, 130, 0.08); }
        .table td{ vertical-align: middle !important; text-align: center; }
        .table th { vertical-align: middle !important; text-align: center; background-color: #033882 !important; }

        div.dataTables_wrapper div.dataTables_filter { float: left; text-align: left; margin-bottom: 8px; }
        div.dataTables_wrapper div.dt-buttons { float: right; text-align: right; margin-bottom: 8px; }

        .dt-button.buttons-excel { background-color: #033882 !important; color: #fff !important; border: none !important; border-radius: 5px !important; padding: 6px 12px !important; font-size: 13px !important; }
        .dt-button.buttons-excel:hover { background-color: #022b65 !important; }

        table.dataTable tr.child td { background-color: #f9f9f9; }
    </style>
</head>

<body>
<section layout:fragment="header">
    <div class="container">
        <div class="row mb-2">
            <div class="col-sm-6"><h1>Reservation List</h1></div>
        </div>
    </div>
</section>

<div class="container" layout:fragment="content">
    <div class="card">

        <form th:action="@{/reservation/list/filter}" method="get" class="form-horizontal mb-3 row">
            <div class="form-group col-md-3">
                <label for="fromDate" class="control-label">From Date</label>
                <input type="date" id="fromDate" name="fromDate" class="form-control"
                       th:value="${#dates.format(fromDate, 'yyyy-MM-dd')}">
            </div>
            <div class="form-group col-md-3">
                <label for="toDate" class="control-label">To Date</label>
                <input type="date" id="toDate" name="toDate" class="form-control"
                       th:value="${#dates.format(toDate, 'yyyy-MM-dd')}">
            </div>
            <div class="form-group col-md-3">
                <label for="movementType" class="control-label" style="color: white;">Movement Type</label>
                <select id="movementType" name="movementType" class="form-control searchable-dropdown" style="width:100%;">
                    <option value="">-- Select Movement Type --</option>
                    <option th:each="mt : ${movementTypes}"
                            th:value="${mt.emdValue1}"
                            th:text="${mt.emdValue2 + ' (' + mt.emdValue1 + ')'}">
                    </option>
                </select>
            </div>
            <div class="form-group col-md-3 align-self-end">
                <button type="submit" class="btn btn-primary">Filter</button>
            </div>
        </form>

        <!-- Reservation Table (simple list like SES List) -->
        <table id="reservationTable" class="table table-striped table-bordered table-hover" style="width:100%">
            <thead class="table-primary">
            <tr>
                <th>Reservation No</th>
                <th>Movement Type</th>
                <th>WBS</th>
                <th>Cost Center</th>
                <th>Req. Date</th>
                <th>Created By</th>
               <!-- <th>Created On</th>-->
                <!--<th>Status</th>
                <th>Actions</th>-->
            </tr>
            </thead>

            <tbody>
            <tr th:each="header : ${headers}">
                <td>
                    <a th:href="@{/reservation/edit(reservationNo=${header.reservationNo})}" th:text="${header.reservationNo}"></a>
                </td>
                <td th:text="${header.movementType}"></td>
                <td th:text="${header.wbs}"></td>
                <td th:text="${header.costCenter}"></td>
                <td th:text="${header.reqDate != null ? (header.reqDate instanceof T(java.time.LocalDate) ? #temporals.format(header.reqDate, 'dd-MMM-yyyy') : #dates.format(header.reqDate, 'dd-MMM-yyyy')) : ''}"></td>
                <td th:text="${header.createdBy}"></td>
               <!-- <td th:text="${header.createdOn != null ? (header.createdOn instanceof T(java.time.LocalDate) ? #temporals.format(header.createdOn, 'dd-MMM-yyyy') : #dates.format(header.createdOn, 'dd-MMM-yyyy')) : ''}"></td>-->
                <!--<td>
                    <span th:classappend="${header.status == 'Released' ? 'badge bg-success' : 'badge bg-warning text-dark'}" th:text="${header.status}"></span>
                </td>
                <td>
                    <a th:href="@{/reservation/edit(reservationNo=${header.reservationNo})}"
                       class="btn btn-sm btn-primary"
                       style="background-color: #033882; border: none;"
                       title="Edit Reservation">
                        <i class="bi bi-pencil-square"></i> Edit
                    </a>
                </td>-->
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div layout:fragment="scriptContent">


    <script th:inline="javascript">
        $(document).ready(function () {
          if (typeof $().select2 === 'function') {
              $('.searchable-dropdown').select2({ placeholder: "-- Select Option --", allowClear: true, width: 'resolve' });
          }

          // Initialize DataTable
          const table = $('#reservationTable').DataTable({
              dom: '<"row mb-2"<"col-md-6"f><"col-md-6 text-right"B>>rt<"row"<"col-md-6"l><"col-md-6"p>>',
              pageLength: 10,
              order: [],
              buttons: [
                  {
                      extend: 'excelHtml5',
                      text: 'Download Excel',
                      exportOptions: { columns: ':visible:not(:first-child)' },
                      customizeData: function (data) {
                          const newBody = [];
                          $('#reservationTable tbody tr').each(function () {
                              const $tr = $(this);
                              const mainRow = $tr.children('td').map(function (i, td) { if (i > 0) return $(td).text().trim(); }).get();
                              newBody.push(mainRow);
                          });
                          data.body = newBody;
                      }
                  }
              ],
              language: { search: "_INPUT_", searchPlaceholder: "Search Reservations...", lengthMenu: "Show _MENU_ entries per page" }
          });
        });
    </script>
</div>

</body>
</html>
