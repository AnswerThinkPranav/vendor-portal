<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="layout">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <style>
        .cp-breadcrumb { font-size: 13px; color: #6c7a91; margin-bottom: 18px; letter-spacing: .2px; }
        .cp-breadcrumb .current { color: var(--blue-color); font-weight: 600; }

        .cp-card { background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(3, 56, 130, 0.08); overflow: hidden; max-width: 480px; margin: 0 auto; }
        .cp-card-header { background: linear-gradient(120deg, var(--blue-color) 0%, #3b4a5e 100%); color: #fff; padding: 18px 28px; }
        .cp-card-header h4 { margin: 0; font-weight: 700; letter-spacing: .3px; }
        .cp-card-header p { margin: 2px 0 0 0; opacity: .85; font-size: 13px; }

        .cp-body { padding: 28px; }
        .cp-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
        .cp-field label { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: #7c879b; }
        .cp-field input { border-radius: 9px; border: 1px solid #dde3ec; height: 40px; font-size: 14px; padding: 0 12px; }
        .cp-field input:focus { border-color: var(--blue-color); box-shadow: 0 0 0 3px rgba(3, 56, 130, 0.12); outline: none; }
        .cp-hint { font-size: 11.5px; color: #8b96ab; margin-top: 2px; }

        .cp-submit {
            background: linear-gradient(120deg, var(--blue-color), #3b4a5e); border: none; border-radius: 9px;
            padding: 10px 22px; font-weight: 600; color: #fff; font-size: 14px; width: 100%;
        }
        .cp-submit:hover { color: #fff; transform: translateY(-1px); }
        .cp-submit:disabled { opacity: .6; cursor: not-allowed; transform: none; }

        .cp-alert { border-radius: 9px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none; }
        .cp-alert-error { background: #fdecea; color: #c0392b; }
        .cp-alert-success { background: #e7f7ee; color: #1c7c4d; }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <div class="cp-breadcrumb">My Account &nbsp;/&nbsp; <span class="current">Change Password</span></div>

        <div class="cp-card">
            <div class="cp-card-header">
                <h4>Change Password</h4>
                <p>Update the password for your account</p>
            </div>
            <div class="cp-body">
                <div class="cp-alert cp-alert-error" id="errorAlert"></div>
                <div class="cp-alert cp-alert-success" id="successAlert"></div>

                <form id="changePasswordForm" onsubmit="return false;">
                    <div class="cp-field">
                        <label>Current Password</label>
                        <input type="password" id="oldPassword" autocomplete="current-password" required>
                    </div>
                    <div class="cp-field">
                        <label>New Password</label>
                        <input type="password" id="newPassword" autocomplete="new-password" minlength="6" required>
                        <div class="cp-hint">At least 6 characters, and different from your current password.</div>
                    </div>
                    <div class="cp-field">
                        <label>Confirm New Password</label>
                        <input type="password" id="confirmPassword" autocomplete="new-password" minlength="6" required>
                    </div>
                    <button type="submit" class="cp-submit" id="submitBtn" onclick="submitChangePassword(this)">Change Password</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="scriptContent">
    <script th:inline="javascript">
        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

        function showAlert(ok, message) {
            const errorEl = document.getElementById('errorAlert');
            const successEl = document.getElementById('successAlert');
            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            const el = ok ? successEl : errorEl;
            el.textContent = message;
            el.style.display = 'block';
        }

        function submitChangePassword(btn) {
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!oldPassword || !newPassword || !confirmPassword) {
                showAlert(false, 'Please fill in all fields.');
                return;
            }
            if (newPassword !== confirmPassword) {
                showAlert(false, 'New password and confirmation do not match.');
                return;
            }
            if (newPassword.length < 6) {
                showAlert(false, 'New password must be at least 6 characters.');
                return;
            }

            btn.disabled = true;
            const originalText = btn.textContent;
            btn.textContent = 'Changing...';

            const body = new URLSearchParams({ oldPassword: oldPassword, newPassword: newPassword, confirmPassword: confirmPassword });
            const headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
            headers[csrfHeader] = csrfToken;

            fetch('/account/changePassword', { method: 'POST', headers: headers, body: body.toString() })
                .then(res => res.json().then(data => ({ ok: res.ok, data: data })))
                .then(({ ok, data }) => {
                    btn.disabled = false;
                    btn.textContent = originalText;
                    if (!ok) {
                        showAlert(false, data.message || 'Could not change password.');
                        return;
                    }
                    showAlert(true, data.message || 'Password changed successfully.');
                    document.getElementById('changePasswordForm').reset();
                })
                .catch(() => {
                    btn.disabled = false;
                    btn.textContent = originalText;
                    showAlert(false, 'Could not change password - please try again.');
                });
        }
    </script>
</div>
</body>
</html>
