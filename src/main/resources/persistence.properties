##### MySQL — override with application-prod.properties on the server
jdbc.driverClassName=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/portal?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=IST
jdbc.user=root
jdbc.pass=root
jdbc.catalog=portal
init-db=false

#################### Hibernate Configuration ##########################
hibernate.show_sql=true
hibernate.hbm2ddl.auto=update
hibernate.dialect=org.hibernate.dialect.MySQLDialect
hibernate.format_sql=true

<!----------Connection pool settings--------->
hikari.connection-timeout=20000
hikari.minimum-idle=10
hikari.maximum-pool-size=10
hikari.idle-timeout=10000
hikari.max-lifetime=1000
hikari.auto-commit=true
