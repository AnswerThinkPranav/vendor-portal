name: Build WAR

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Display Java Version
        shell: powershell
        run: |
          java -version

      - name: Build WAR
        shell: powershell
        run: |
          .\mvnw.cmd clean package

      - name: Create Deployments Folder
        shell: powershell
        run: |
          if (!(Test-Path "C:\Deployments")) {
              New-Item -ItemType Directory -Path "C:\Deployments" | Out-Null
          }

      - name: Backup Existing ROOT.war
        shell: powershell
        run: |
          $dest = "C:\Deployments\ROOT.war"

          if (Test-Path $dest) {
              $date = Get-Date -Format "yyyyMMdd_HHmmss"
              Rename-Item -Path $dest -NewName "ROOT_BACKUP_$date.war"
          }

      - name: Copy WAR as ROOT.war
        shell: powershell
        run: |
          $war = Get-ChildItem "target\*.war" | Select-Object -First 1

          if ($null -eq $war) {
              Write-Error "WAR file not found in target folder."
          }

          Copy-Item $war.FullName "C:\Deployments\ROOT.war" -Force

      - name: Verify Deployment
        shell: powershell
        run: |
          Get-ChildItem C:\Deployments