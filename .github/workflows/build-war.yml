name: Build WAR

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Display Java Version
        shell: cmd
        run: java -version

      - name: Build WAR
        shell: cmd
        run: mvnw.cmd clean package

      - name: Create Deployments Folder
        shell: cmd
        run: |
          if not exist C:\Deployments mkdir C:\Deployments

      - name: Backup Existing ROOT.war
        shell: cmd
        run: |
          if exist C:\Deployments\ROOT.war ren C:\Deployments\ROOT.war ROOT_OLD.war

      - name: Copy WAR
        shell: cmd
        run: |
          copy /Y target\*.war C:\Deployments\ROOT.war

      - name: Verify
        shell: cmd
        run: |
          dir C:\Deployments